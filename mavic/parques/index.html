  }

  function badgeSVG(){
    if(IS_TRAIL) return '<svg class="badge" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="var(--good-tint)" stroke="var(--pine)" stroke-width="4"/><rect x="54" y="62" width="12" height="30" fill="var(--bark)"/><path d="M60 20 l-20 30 h40z M60 36 l-26 34 h52z" fill="var(--pine)"/><text x="60" y="106" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="10" fill="var(--pine)" letter-spacing="1.2">PARK READY</text></svg>';
    if(IS_RADIO) return '<svg class="badge" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="var(--terra-tint)" stroke="var(--terra)" stroke-width="4"/><path d="M60 22l10.6 21.5 23.7 3.4-17.1 16.7 4 23.6L60 76 38.8 87.2l4-23.6L25.7 46.9l23.7-3.4z" fill="var(--terra)"/><text x="60" y="106" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="11" fill="var(--terra-dark)" letter-spacing="1.5">FLOOR STAR</text></svg>';
    return '<svg class="badge" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="var(--good-tint)" stroke="var(--good)" stroke-width="4"/><path d="M60 88s-26-15-26-34a14 14 0 0 1 26-7 14 14 0 0 1 26 7c0 19-26 34-26 34z" fill="var(--terra)"/><path d="M30 60h14l5-9 7 18 5-12 4 3h25" fill="none" stroke="var(--surface)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function doneScreen(){
    clearInterval(callTimer); S.cur=null; drawVisual(); radioState("");
    var ft=count(S.firstTry), sp=count(S.spoken), r2=Object.keys(S.r2).filter(function(k){return S.r2[k]===1;}).length;
    var score=Math.round((ft+sp+r2)/3);
    saved.plays=(saved.plays||0)+1; if(score>saved.best) saved.best=score; saved.last=new Date().toISOString().slice(0,10); persist();
    speak(CFG.doneLine);
    var missed=Object.keys(S.missed).map(byId);
    ST.innerHTML='<div class="card reveal">'+badgeSVG()+'<div class="done-h">'+esc(CFG.doneTitle)+'</div><div class="done-line">"'+esc(CFG.doneLine)+'"</div>'+
      '<div class="score"><div><b>'+ft+'</b><span>Primer intento</span></div><div><b>'+sp+'</b><span>Dichas bien</span></div><div><b>'+r2+'</b><span>Sin opciones</span></div></div>'+
      '<div class="rules">'+CFG.rules.map(function(r){return '<div class="rule"><h3>'+esc(r.h)+'</h3><p>'+r.b+'</p></div>';}).join("")+'</div>'+
      (missed.length?'<div class="why" style="margin-top:14px"><b>Repasa en voz alta:</b><br>'+missed.map(function(m){return esc(m.right);}).join("<br>")+'</div>':'')+
      '<div class="row"><button class="btn main" id="again">Otro turno</button><a class="btn" style="text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+esc(CFG.back)+'">Volver</a></div>'+
      '<div class="best" style="text-align:center">Mejor puntaje: '+saved.best+' / '+N+' · Turnos: '+saved.plays+'</div></div>';
    document.getElementById("again").onclick=function(){ S={round:1,queue:[],done:{},firstTry:{},spoken:{},missed:{},r2:{},cur:null,phase:"pick"}; startScreen(); };
  }

  window.__arches = { S:S, grade:grade, norm:norm, get state(){ return S; } };
  startScreen();
})();
</script>
</body>
</html>
