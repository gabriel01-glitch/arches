<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Express · Mavic</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#fbf7f0;--surface:#fffdf9;--ink:#1c1814;--muted:#8a8074;--line:#e6dccf;--terra:#bf5a36;--terra-dark:#9f4528;--terra-tint:#f4e4d9;--ok:#2f6b4f;--ok-tint:#e8f3ec;--bad:#a33;--bad-tint:#fceceb}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
.wrap{max-width:440px;margin:0 auto;padding:16px 16px 48px}a.back{color:var(--terra);font-weight:800;font-size:13px;text-decoration:none}
h1{font-family:Cormorant Garamond,Georgia,serif;font-size:34px;color:var(--terra-dark);margin:10px 0 4px}
.sub{color:var(--muted);font-weight:700;font-size:14px;margin:0 0 14px}
.barra{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.barra span{background:var(--terra-tint);color:var(--terra-dark);font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
.card h2{font-family:Cormorant Garamond,Georgia,serif;font-size:22px;margin:0 0 8px;color:var(--terra-dark)}
.meta{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.prompt{font-size:16px;font-weight:700;margin:0 0 12px}.opts{display:grid;gap:8px}
.opts button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.opts button.ok{border-color:var(--ok);background:var(--ok-tint)}.opts button.no{border-color:var(--bad);background:var(--bad-tint)}
.fb{min-height:22px;font-weight:800;font-size:14px;margin-top:10px}.fb.good{color:var(--ok)}.fb.bad{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}
.btn{border:0;background:var(--terra);color:#fff;font-weight:800;padding:12px 16px;border-radius:999px;font-size:14px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--terra-dark);border:1.5px solid var(--line)}.score{font-weight:800;color:var(--muted);font-size:13px}
.ego{background:#fff6e8;border:1.5px solid #e8c98a;border-radius:14px;padding:12px;font-size:14px;font-weight:700;margin:0 0 14px}
.done{text-align:center;padding:24px 8px}.done h2{font-family:Cormorant Garamond,Georgia,serif;color:var(--terra-dark);font-size:28px;margin:0 0 8px}
</style></head><body><div class="wrap">
<a class="back" href="../?name=Mavic">← Mavic</a>
<h1>Radio Express</h1>
<p class="sub">Relé bajo micrófono. Clarifiers + claim / because / proof.</p>
<div class="barra"><span>CLARIFY</span><span>BUY TIME</span><span>3-BEAT</span></div>
<div class="ego">Si te congelas → compra tiempo, luego claim + because + proof.</div>
<div id="app"></div></div>
<script>
const KEY="arches_mavic_rele";
const ITEMS=[{"tag":"Clarify","q":"You missed a fast question. Clean buy-time:","opts":["Sorry, I didn't catch that.","Sorry, I no catch that.","Sorry, I wasn't catch that."],"ans":"Sorry, I didn't catch that.","why":"didn't catch = pasado limpio para 'no pesqué'."},{"tag":"Clarify","q":"Ask them to say it again:","opts":["Could you repeat that, please?","Can you to repeat, please?","You repeat again, please?"],"ans":"Could you repeat that, please?","why":"Could you + verbo base."},{"tag":"Clarify","q":"Confirm what you heard:","opts":["Just to make sure — you mean the morning show?","Just for sure — you mean the morning show?","Just to sure — you mean the morning show?"],"ans":"Just to make sure — you mean the morning show?","why":"to make sure = confirmar."},{"tag":"Buy time","q":"You need two seconds:","opts":["That's a great question — give me a second.","That's great question — give me second.","That is a great — give me one second please to think."],"ans":"That's a great question — give me a second.","why":"That's a… + give me a second. Corto."},{"tag":"Buy time","q":"Soft stall before the answer:","opts":["Let me think for a moment.","Let me to think a moment.","I think me for a moment."],"ans":"Let me think for a moment.","why":"Let me + verbo base."},{"tag":"3-beat","q":"Claim + because + proof. Best claim:","opts":["I love live radio because every second is real — last week we fixed a dead mic in under a minute.","I love live radio. Because is real. Last week.","Live radio I love it because real and last week mic."],"ans":"I love live radio because every second is real — last week we fixed a dead mic in under a minute.","why":"claim + because + proof en una línea limpia."},{"tag":"3-beat","q":"Unexpected: 'Why should listeners trust you?'","opts":["Because I check facts before I speak — yesterday I called the source twice.","Because I check facts. I am trust. Yesterday call.","I was check the facts because trust."],"ans":"Because I check facts before I speak — yesterday I called the source twice.","why":"because + present habit + past proof."},{"tag":"3-beat","q":"Fast follow-up: 'What went wrong on air?'","opts":["The guest froze, so I asked a simple question and bought us ten seconds.","The guest freeze, so I ask simple and buy ten seconds.","Guest was freeze so I was buy time."],"ans":"The guest froze, so I asked a simple question and bought us ten seconds.","why":"pasado limpio: froze / asked / bought."},{"tag":"Radio","q":"You want to slow the host:","opts":["Could you slow down a little?","Could you to slow a little?","You can more slow, please?"],"ans":"Could you slow down a little?","why":"slow down = phrasal; Could you + base."},{"tag":"Radio","q":"Admit a blank without dying:","opts":["I don't have that number on hand — can I get back to you?","I no have that number — I return you.","I don't have — I will to get back."],"ans":"I don't have that number on hand — can I get back to you?","why":"on hand + get back to you."},{"tag":"Radio","q":"Close a 3-beat cleanly:","opts":["So: clear claim, real reason, one proof. That's my answer.","So claim reason proof I answer.","Then I finish with the claim because proof."],"ans":"So: clear claim, real reason, one proof. That's my answer.","why":"cierre corto = control."},{"tag":"Pressure","q":"They talk over you. Clean line:","opts":["Sorry — one second — I want to finish this thought.","Sorry one second I want finish this think.","Sorry, I was want to finish."],"ans":"Sorry — one second — I want to finish this thought.","why":"want TO finish + thought."},{"tag":"Pressure","q":"After a miss: rebuild trust:","opts":["Thanks for repeating that. Here's my answer in three beats.","Thanks for repeat. Here is my answer three.","Thank you for to repeat. My answer is."],"ans":"Thanks for repeating that. Here's my answer in three beats.","why":"Thanks for + -ing."},{"tag":"Pressure","q":"Host: 'Any last word?' Best 3-beat:","opts":["Listeners deserve honesty because trust is the brand — we say when we don't know.","Listeners deserve honesty. Trust brand. We say no know.","Honesty because trust and we don't know sometimes yes."],"ans":"Listeners deserve honesty because trust is the brand — we say when we don't know.","why":"claim + because + proof (habit)."}];
let i=0,ok=0,lock=false;const app=document.getElementById("app");
function save(){try{localStorage.setItem(KEY,JSON.stringify({i,ok,t:Date.now()}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&typeof s.i==="number"){i=Math.min(s.i,ITEMS.length);ok=s.ok||0}}catch(e){}}
function render(){if(i>=ITEMS.length){app.innerHTML='<div class="card done"><h2>Listo</h2><p class="sub">'+ok+" / "+ITEMS.length+' limpios.</p><button class="btn" id="again">Otra vez</button></div>';document.getElementById("again").onclick=()=>{i=0;ok=0;save();render()};return;}
const it=ITEMS[i];app.innerHTML='<div class="card"><div class="meta">'+it.tag+" · "+(i+1)+" / "+ITEMS.length+'</div><h2>Elige la forma limpia</h2><p class="prompt">'+it.q+'</p><div class="opts" id="opts"></div><div class="fb" id="fb"></div><div class="row"><span class="score">✓ '+ok+'</span><button class="btn ghost" id="next" disabled>Siguiente</button></div></div>';
const box=document.getElementById("opts");lock=false;it.opts.forEach(o=>{const b=document.createElement("button");b.textContent=o;b.onclick=()=>{if(lock)return;lock=true;const good=o===it.ans;b.className=good?"ok":"no";[...box.children].forEach(x=>{if(x.textContent===it.ans)x.classList.add("ok")});const fb=document.getElementById("fb");fb.className="fb "+(good?"good":"bad");fb.textContent=(good?"Bien. ":"Casi. ")+it.why;if(good)ok++;document.getElementById("next").disabled=false;save();};box.appendChild(b);});
document.getElementById("next").onclick=()=>{i++;save();render()};}
load();render();
</script></body></html>
