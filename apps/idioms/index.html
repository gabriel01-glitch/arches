<!DOCTYPE html>
<html lang="es">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idioms · ARCHES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fbf7f0; --surface:#fffdf9; --ink:#2c2722; --muted:#8a7f73;
    --line:#e9e0d3; --terra:#bf5a36; --terra-dark:#8e3b22; --terra-tint:#f4e4d9;
    --good:#3f695e; --good-tint:#e8f1dd; --bad-tint:#f6e2da;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--cream);color:var(--ink);font-family:'Nunito',sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  ::selection{background:var(--terra-tint);color:var(--ink)}
  :focus-visible{outline:2px solid var(--terra);outline-offset:3px}
  .wrap{max-width:540px;margin:0 auto;padding:22px 18px 56px}

  .hello{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:40px;line-height:1.02}
  .hello .nm{color:var(--terra)}
  .sub{font-size:15px;color:var(--muted);font-weight:600;margin-top:10px;line-height:1.45}
  .meta{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--terra);margin-top:18px}

  .modes{display:flex;flex-direction:column;gap:12px;margin-top:22px}
  .mode{
    display:block;width:100%;text-align:left;background:var(--surface);
    border:1.5px solid var(--line);border-radius:18px;padding:18px 18px 16px;
    font-family:'Nunito',sans-serif;cursor:pointer;
    transition:transform .15s ease,border-color .15s ease,box-shadow .2s ease;
  }
  .mode:hover{transform:translateY(-3px);border-color:var(--terra);box-shadow:0 8px 18px rgba(44,39,34,.08)}
  .mode:active{transform:scale(.985)}
  .mode .t{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:28px;line-height:1.1}
  .mode .d{font-size:14px;color:var(--muted);font-weight:600;margin-top:4px;line-height:1.4}
  .mode.hot{border-color:var(--terra);background:linear-gradient(180deg,#fffdf9,#f7ebe3)}

  .ptop{display:flex;align-items:center;gap:12px;padding:4px 0 16px}
  .pback{
    background:none;border:none;color:var(--terra-dark);font-weight:800;font-size:15px;
    cursor:pointer;font-family:'Nunito',sans-serif;padding:8px 4px;min-height:44px;
  }
  .pbar{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
  .pbar > i{display:block;height:100%;background:var(--terra);width:0;transition:width .35s ease}
  .pcount{font-size:13px;color:var(--muted);font-weight:800;white-space:nowrap}

  .kicker{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--terra);font-weight:800;margin-bottom:12px}
  .card{
    background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px;
  }
  .picwrap{
    background:var(--cream);border-radius:14px;overflow:hidden;border:1px solid var(--line);
  }
  .pic{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:var(--cream)}

  .idiom{
    font-family:'Cormorant Garamond',serif;font-weight:700;font-size:30px;line-height:1.15;
    margin:14px 2px 0;
  }
  .es{font-size:16px;font-weight:800;color:var(--terra-dark);margin-top:8px}
  .meaning{font-size:15px;font-weight:600;color:var(--muted);margin-top:6px;line-height:1.4}
  .ex{
    margin-top:12px;background:var(--cream);border-radius:12px;padding:12px 14px;
    font-weight:700;font-size:15.5px;line-height:1.4;
  }
  .ex em{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;color:var(--terra-dark)}

  .opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .opt{
    background:var(--cream);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;
    font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;
    font-family:'Nunito',sans-serif;min-height:48px;
    transition:transform .08s ease,border-color .12s,background .12s;
  }
  .opt:active{transform:scale(.98)}
  .opt.ok{background:var(--good-tint);border-color:var(--good);color:var(--good)}
  .opt.no{background:var(--bad-tint);border-color:var(--terra);color:var(--terra-dark)}

  .btn{
    border:none;border-radius:14px;font-family:'Nunito',sans-serif;font-weight:800;
    font-size:16px;padding:15px;cursor:pointer;min-height:48px;
    transition:transform .08s ease,background .15s ease;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--terra-dark);color:#fff;width:100%;margin-top:14px}
  .btn-primary:hover{background:#7a311c}
  .row2{display:flex;gap:10px;margin-top:12px}
  .btn-ghost{
    background:var(--cream);color:var(--ink);border:1.5px solid var(--line);flex:1;
  }

  .speaker{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    background:var(--cream);border:1.5px solid var(--line);border-radius:30px;
    padding:12px 20px;font-weight:800;font-size:15px;color:var(--ink);
    cursor:pointer;font-family:'Nunito',sans-serif;margin-top:14px;width:100%;min-height:48px;
  }
  .speaker:active{border-color:var(--terra)}
  .speaker svg{display:block}

  .hintline{font-size:15px;font-weight:700;color:var(--terra-dark);margin-top:12px;min-height:1.4em}

  .fb{margin-top:14px;border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;line-height:1.4}
  .fb.ok{background:var(--good-tint);color:var(--good)}
  .fb.no{background:var(--bad-tint);color:var(--terra-dark)}

  .done{text-align:center;padding:28px 8px}
  .done h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:34px;margin:0 0 8px}
  .done .score{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:64px;color:var(--terra);line-height:1;margin:12px 0}
  .done p{color:var(--muted);font-weight:600;font-size:15px;margin:0 0 22px}

  .credit{text-align:center;color:#c9bdac;font-size:11.5px;font-weight:700;margin-top:28px;letter-spacing:.5px}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition:none !important;animation:none !important}
    .mode:hover{transform:none}
  }
</style>
</head>
<body>
<!--
THESIS: Guess the idiom from the literal picture. The absurd image is the memory, not a word list.
OWN-WORLD: ARCHES cream, terracotta, Cormorant + Nunito. The drawing fills the card.
STORY: See the picture, name the idiom, then get Spanish + a sentence you can steal.
FIRST VIEWPORT: Hello, one line of why, two modes. Class puts the picture on screen immediately.
FORM: Inherited ARCHES student practice. FINISH: live on their hub for today's class.
-->
<div class="wrap" id="app"></div>
<noscript><p style="padding:24px;font-family:Nunito,sans-serif">Abre esta página con JavaScript para practicar.</p></noscript>

<script>
(function(){
  "use strict";

  const IDIOMS = [
    {
      id:"raining-cats", img:"raining-cats.webp",
      idiom:"It's raining cats and dogs", short:"raining cats and dogs",
      es:"llover a cántaros",
      meaning:"Está lloviendo muy fuerte.",
      example:"Don't go out — it's raining cats and dogs.",
      say:"It's raining cats and dogs.",
      alts:["it's raining cats and dogs","raining cats and dogs"]
    },
    {
      id:"pigs-fly", img:"pigs-fly.webp",
      idiom:"When pigs fly", short:"when pigs fly",
      es:"cuando las vacas vuelen",
      meaning:"Algo que nunca va a pasar.",
      example:"He'll clean his room when pigs fly.",
      say:"When pigs fly.",
      alts:["when pigs fly","that'll happen when pigs fly"]
    },
    {
      id:"spill-beans", img:"spill-beans.webp",
      idiom:"Spill the beans", short:"spill the beans",
      es:"soltar la sopa / revelar el secreto",
      meaning:"Contar un secreto.",
      example:"Don't spill the beans about the party.",
      say:"Don't spill the beans.",
      alts:["spill the beans","to spill the beans","don't spill the beans"]
    },
    {
      id:"arm-and-leg", img:"arm-and-leg.webp",
      idiom:"Cost an arm and a leg", short:"cost an arm and a leg",
      es:"costar un ojo de la cara",
      meaning:"Ser muy caro.",
      example:"That bag cost an arm and a leg.",
      say:"It cost an arm and a leg.",
      alts:["cost an arm and a leg","costs an arm and a leg","it cost an arm and a leg","it costs an arm and a leg"]
    },
    {
      id:"piece-of-cake", img:"piece-of-cake.webp",
      idiom:"A piece of cake", short:"a piece of cake",
      es:"pan comido",
      meaning:"Muy fácil.",
      example:"The interview was a piece of cake.",
      say:"It was a piece of cake.",
      alts:["a piece of cake","it's a piece of cake","piece of cake"]
    },
    {
      id:"cat-out-of-bag", img:"cat-out-of-bag.webp",
      idiom:"Let the cat out of the bag", short:"let the cat out of the bag",
      es:"irse de la lengua",
      meaning:"Revelar un secreto, a veces sin querer.",
      example:"She let the cat out of the bag.",
      say:"She let the cat out of the bag.",
      alts:["let the cat out of the bag","let the cat out","the cat is out of the bag"]
    },
    {
      id:"ball-in-court", img:"ball-in-court.webp",
      idiom:"The ball is in your court", short:"the ball is in your court",
      es:"la pelota está en tu tejado",
      meaning:"Te toca a ti decidir o responder.",
      example:"I sent the offer. The ball is in your court.",
      say:"The ball is in your court.",
      alts:["the ball is in your court","ball is in your court"]
    },
    {
      id:"under-weather", img:"under-weather.webp",
      idiom:"Under the weather", short:"under the weather",
      es:"estar indispuesto / malito",
      meaning:"No sentirse bien, un poco enfermo.",
      example:"I'm a bit under the weather today.",
      say:"I'm a bit under the weather today.",
      alts:["under the weather","i'm under the weather","feeling under the weather"]
    },
    {
      id:"over-the-moon", img:"over-the-moon.webp",
      idiom:"Over the moon", short:"over the moon",
      es:"en la gloria / eufórico",
      meaning:"Muy, muy feliz.",
      example:"She was over the moon when she got the job.",
      say:"I'm over the moon.",
      alts:["over the moon","i'm over the moon","over the moon about it"]
    },
    {
      id:"nail-on-head", img:"nail-on-head.webp",
      idiom:"Hit the nail on the head", short:"hit the nail on the head",
      es:"dar en el clavo",
      meaning:"Acertar exactamente.",
      example:"You hit the nail on the head.",
      say:"You hit the nail on the head.",
      alts:["hit the nail on the head","you hit the nail on the head"]
    },
    {
      id:"cold-feet", img:"cold-feet.webp",
      idiom:"Get cold feet", short:"get cold feet",
      es:"acobardarse a último momento",
      meaning:"Echarse atrás justo antes de hacerlo.",
      example:"He got cold feet before the interview.",
      say:"He got cold feet.",
      alts:["get cold feet","got cold feet","have cold feet"]
    },
    {
      id:"beat-around-bush", img:"beat-around-bush.webp",
      idiom:"Beat around the bush", short:"beat around the bush",
      es:"andarse por las ramas",
      meaning:"Evitar el punto. No ir al grano.",
      example:"Stop beating around the bush.",
      say:"Stop beating around the bush.",
      alts:["beat around the bush","beating around the bush","stop beating around the bush"]
    },
    {
      id:"blue-moon", img:"blue-moon.webp",
      idiom:"Once in a blue moon", short:"once in a blue moon",
      es:"de uvas a peras",
      meaning:"Muy de vez en cuando.",
      example:"We go there once in a blue moon.",
      say:"Once in a blue moon.",
      alts:["once in a blue moon"]
    },
    {
      id:"butterflies", img:"butterflies.webp",
      idiom:"Butterflies in my stomach", short:"butterflies in my stomach",
      es:"mariposas en el estómago",
      meaning:"Nervios, esa sensación rara en la panza.",
      example:"I had butterflies in my stomach before the call.",
      say:"I have butterflies in my stomach.",
      alts:["butterflies in my stomach","butterflies in your stomach","have butterflies"]
    }
  ];

  const params = new URLSearchParams(location.search);
  const displayName = params.get("name") || "";
  const app = document.getElementById("app");
  const IMG = "img/";

  let view = "home", mode = "clase", queue = [], qi = 0, right = 0, total = 0, locked = false;

  const speakerSVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M19 5a9 9 0 0 1 0 14"/><path d="M15.5 8.5a4 4 0 0 1 0 7"/></svg>';

  let voice = null, audioReady = false;
  function loadVoice(){
    const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    const NOV=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|kathy|ralph|fred/i;
    const en=vs.filter(v=>/^en[-_]/i.test(v.lang)&&!NOV.test(v.name));
    const pref=["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Zira","Alex"];
    voice=null;
    for(const p of pref){ const m=en.find(v=>v.name.indexOf(p)===0); if(m){voice=m;break;} }
    if(!voice) voice = en.find(v=>/en[-_]US/i.test(v.lang)) || en[0] || null;
  }
  if(window.speechSynthesis){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
  function unlockAudio(){
    if(audioReady || !window.speechSynthesis) return;
    try{ const u=new SpeechSynthesisUtterance(""); u.volume=0; speechSynthesis.speak(u); audioReady=true; }catch(e){}
  }
  document.addEventListener("touchstart", unlockAudio, {once:true});
  document.addEventListener("click", unlockAudio, {once:true});
  function speak(text){
    if(!text || !window.speechSynthesis) return;
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang="en-US"; u.rate=0.95; if(voice) u.voice=voice;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  function esc(s){ return (s==null?"":""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }

  function distractors(item){
    const pool = shuffle(IDIOMS.filter(x=>x.id!==item.id)).slice(0,2).map(x=>x.short);
    return shuffle([item.short].concat(pool));
  }

  function renderHome(){
    view="home";
    const who = displayName ? 'Hola <span class="nm">'+esc(displayName)+'</span>' : 'Idioms';
    app.innerHTML =
      '<div class="hello">'+who+'</div>'+
      (displayName?'<div class="sub">Mira el dibujo. El inglés literal es ridículo — por eso se te queda.</div>':
                   '<div class="sub">Mira el dibujo. El inglés literal es ridículo — por eso se te queda.</div>')+
      '<div class="meta">B1–B2 · 14 dibujos</div>'+
      '<div class="modes">'+
        '<button class="mode hot" id="mClase"><div class="t">Clase</div><div class="d">El dibujo grande. Lo dicen. Tú revelas. Para las dos, en voz alta.</div></button>'+
        '<button class="mode" id="mPrac"><div class="t">Practicar</div><div class="d">Tres opciones. Eligen el idiom. Luego la frase.</div></button>'+
      '</div>'+
      '<div class="credit">ARCHES · Idioms</div>';
    document.getElementById("mClase").onclick=()=>start("clase");
    document.getElementById("mPrac").onclick=()=>start("practicar");
  }

  function start(m){
    unlockAudio();
    mode=m; queue=shuffle(IDIOMS); qi=0; right=0; total=0; locked=false;
    renderCard();
  }

  function shell(inner){
    const pct = queue.length ? Math.round(qi/queue.length*100) : 0;
    app.innerHTML =
      '<div class="ptop">'+
        '<button class="pback" id="pb" type="button">‹ Inicio</button>'+
        '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="pcount">'+(qi+1)+' / '+queue.length+'</div>'+
      '</div>'+inner;
    document.getElementById("pb").onclick=renderHome;
  }

  function picHTML(item){
    return '<div class="picwrap"><img class="pic" src="'+IMG+item.img+'" width="1100" height="1100" alt=""></div>';
  }

  function revealBlock(item){
    return '<div class="idiom">'+esc(item.idiom)+'</div>'+
      '<div class="es">'+esc(item.es)+'</div>'+
      '<div class="meaning">'+esc(item.meaning)+'</div>'+
      '<div class="ex"><em>Example.</em> '+esc(item.example)+'</div>'+
      '<button class="speaker" id="play" type="button">'+speakerSVG+'Escuchar</button>';
  }

  function renderCard(){
    if(qi>=queue.length) return renderDone();
    locked=false;
    const item=queue[qi];
    if(mode==="clase") return renderClase(item);
    return renderPrac(item);
  }

  function renderClase(item){
    shell(
      '<div class="kicker">Mira el dibujo</div>'+
      '<div class="card">'+
        picHTML(item)+
        '<div class="hintline" id="hint"></div>'+
        '<div id="rev"></div>'+
        '<div class="row2" id="acts">'+
          '<button class="btn btn-ghost" id="hintBtn" type="button">Pista en español</button>'+
          '<button class="btn btn-primary" id="revBtn" type="button" style="margin-top:0">Revelar</button>'+
        '</div>'+
      '</div>'
    );
    document.getElementById("hintBtn").onclick=function(){
      document.getElementById("hint").textContent = item.es;
    };
    document.getElementById("revBtn").onclick=function(){
      document.getElementById("acts").innerHTML = '';
      document.getElementById("hint").textContent = '';
      document.getElementById("rev").innerHTML = revealBlock(item);
      document.getElementById("play").onclick=()=>speak(item.say);
      speak(item.say);
      const next=el('<button class="btn btn-primary" type="button">Siguiente</button>');
      next.onclick=()=>{ qi++; renderCard(); };
      document.getElementById("acts").appendChild(next);
    };
  }

  function renderPrac(item){
    const opts = distractors(item);
    shell(
      '<div class="kicker">¿Cuál es el idiom?</div>'+
      '<div class="card">'+
        picHTML(item)+
        '<div class="opts" id="opts"></div>'+
        '<div id="fb"></div>'+
        '<div id="rev"></div>'+
        '<div id="acts"></div>'+
      '</div>'
    );
    const box=document.getElementById("opts");
    let firstTry=true;
    opts.forEach(function(o){
      const b=el('<button class="opt" type="button">'+esc(o)+'</button>');
      b.onclick=function(){
        if(locked) return;
        if(o===item.short){
          locked=true; total++; if(firstTry) right++;
          b.classList.add("ok");
          document.getElementById("fb").innerHTML='<div class="fb ok">Eso es.</div>';
          finishPrac(item);
        } else {
          firstTry=false;
          b.classList.add("no"); b.disabled=true;
          document.getElementById("fb").innerHTML='<div class="fb no">Esa no. Prueba otra.</div>';
        }
      };
      box.appendChild(b);
    });
  }

  function finishPrac(item){
    document.querySelectorAll(".opt").forEach(function(b){
      b.disabled=true;
      if(b.textContent===item.short) b.classList.add("ok");
    });
    document.getElementById("rev").innerHTML = revealBlock(item);
    document.getElementById("play").onclick=()=>speak(item.say);
    speak(item.say);
    const next=el('<button class="btn btn-primary" type="button">Siguiente</button>');
    next.onclick=()=>{ qi++; renderCard(); };
    document.getElementById("acts").appendChild(next);
  }

  function renderDone(){
    const line = mode==="clase"
      ? "Ahora que vieron el dibujo, el idiom se queda."
      : (total && right/total>=.8 ? "Casi todos. El dibujo hizo su trabajo." : "Otra vuelta y se quedan.");
    const score = mode==="clase" ? queue.length+" dibujos" : right+"/"+total;
    app.innerHTML =
      '<div class="done">'+
        '<h2>Idioms</h2>'+
        '<div class="score">'+esc(score)+'</div>'+
        '<p>'+line+'</p>'+
        '<button class="btn btn-primary" id="again" type="button">Otra vez</button>'+
        '<div class="row2"><button class="btn btn-ghost" id="home" type="button">Volver al inicio</button></div>'+
      '</div>';
    document.getElementById("again").onclick=()=>start(mode);
    document.getElementById("home").onclick=renderHome;
  }

  const boot = (params.get("mode")||"").toLowerCase();
  if(boot==="clase") start("clase");
  else if(boot==="practicar" || boot==="practice") start("practicar");
  else renderHome();
})();
</script>
</body>
</html>
