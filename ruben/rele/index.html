<!DOCTYPE html>
<html lang="es"><head><meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascensor · Ruben</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#fbf7f0;--surface:#fffdf9;--ink:#1c1814;--muted:#8a8074;--line:#e6dccf;--terra:#bf5a36;--terra-dark:#9f4528;--terra-tint:#f4e4d9;--ok:#2f6b4f;--ok-tint:#e8f3ec;--bad:#a33;--bad-tint:#fceceb}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
.wrap{max-width:440px;margin:0 auto;padding:16px 16px 48px}a.back{color:var(--terra);font-weight:800;font-size:13px;text-decoration:none}
h1{font-family:Cormorant Garamond,Georgia,serif;font-size:34px;color:var(--terra-dark);margin:10px 0 4px}
.sub{color:var(--muted);font-weight:700;font-size:14px;margin:0 0 14px}
.barra{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.barra span{background:var(--terra-tint);color:var(--terra-dark);font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
.card h2{font-family:Cormorant Garamond,Georgia,serif;font-size:22px;margin:0 0 8px;color:var(--terra-dark)}
.meta{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.prompt{font-size:16px;font-weight:700;margin:0 0 12px}.opts{display:grid;gap:8px}
.opts button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.opts button.ok{border-color:var(--ok);background:var(--ok-tint)}.opts button.no{border-color:var(--bad);background:var(--bad-tint)}
.fb{min-height:22px;font-weight:800;font-size:14px;margin-top:10px}.fb.good{color:var(--ok)}.fb.bad{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}
.btn{border:0;background:var(--terra);color:#fff;font-weight:800;padding:12px 16px;border-radius:999px;font-size:14px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--terra-dark);border:1.5px solid var(--line)}.score{font-weight:800;color:var(--muted);font-size:13px}
.ego{background:#fff6e8;border:1.5px solid #e8c98a;border-radius:14px;padding:12px;font-size:14px;font-weight:700;margin:0 0 14px}
.done{text-align:center;padding:24px 8px}.done h2{font-family:Cormorant Garamond,Georgia,serif;color:var(--terra-dark);font-size:28px;margin:0 0 8px}
</style></head><body><div class="wrap">
<a class="back" href="../?name=Ruben">← Ruben</a>
<h1>Ascensor</h1>
<p class="sub">Frame first + máximo 3 oraciones. On Saturdays / After work / At the clinic.</p>
<div class="barra"><span>FRAME</span><span>MAX 3</span><span>STOP DUMP</span></div>
<div class="ego">Primero el frame. Luego máximo tres oraciones. Corta el curriculum.</div>
<div id="app"></div></div>
<script>
const KEY="arches_ruben_rele";
const ITEMS=[{"tag":"Frame","q":"Weekend habit. Open with:","opts":["On Saturdays, I work at the clinic until two.","I work and also on Saturdays I do many things at the clinic including…","Saturdays I at clinic work until two."],"ans":"On Saturdays, I work at the clinic until two.","why":"On Saturdays = frame first."},{"tag":"Frame","q":"After a long day:","opts":["After work, I get home and rest.","I get home after work and also I explain my whole week…","After work I am get home rest."],"ans":"After work, I get home and rest.","why":"After work = frame."},{"tag":"Frame","q":"Place frame:","opts":["At the clinic, I check the equipment first.","I check the equipment and then the other equipment and then…","Clinic I check equipment first."],"ans":"At the clinic, I check the equipment first.","why":"At the clinic = frame."},{"tag":"Max3","q":"Best short pitch:","opts":["I check the equipment. I repair it. I install new machines.","I check the equipment and I also studied in Cuba and my boss said…","Check repair install machines I."],"ans":"I check the equipment. I repair it. I install new machines.","why":"exactamente 3 oraciones."},{"tag":"Max3","q":"Too long. Cut to:","opts":["After work I get home. I eat. I rest.","After work I get home then I eat then I watch TV then I sleep and…","I get home after."],"ans":"After work I get home. I eat. I rest.","why":"3 golpes. Stop."},{"tag":"Max3","q":"Clinic intro:","opts":["I keep the equipment safe. I fix problems fast. I ask when I'm not sure.","I keep safe and fix things and I have many papers from…","Safe equipment fix ask."],"ans":"I keep the equipment safe. I fix problems fast. I ask when I'm not sure.","why":"3 ideas, sin lista larga."},{"tag":"Get home","q":"Clean line:","opts":["I get home at five.","I get to home at five.","I am get home at five."],"ans":"I get home at five.","why":"get home (sin to)."},{"tag":"Get home","q":"With frame:","opts":["After work, I get home at five.","After work, I get to home at five.","After work I getting home."],"ans":"After work, I get home at five.","why":"frame + get home."},{"tag":"Clinic","q":"One job, one line:","opts":["At the clinic I repair medical equipment.","At the clinic I repair equipment and also explain my career from the beginning…","Clinic repair medical equipment I."],"ans":"At the clinic I repair medical equipment.","why":"una línea = poder."},{"tag":"Stop","q":"The interviewer looks tired. You say:","opts":["That's the short version.","Let me also add my certificates, my tools, my…","I continue with more detail now."],"ans":"That's the short version.","why":"corta tú mismo."},{"tag":"Stop","q":"They ask 'What else?' Still max 3:","opts":["I work carefully. I solve problems. I learn new machines quickly.","I work carefully and solve problems and learn and also inventory and…","Careful solve learn machines."],"ans":"I work carefully. I solve problems. I learn new machines quickly.","why":"otra tanda de 3, no 10."},{"tag":"Mix","q":"Full clean elevator:","opts":["On Saturdays I work at the clinic. I test the equipment. I go home at two.","On Saturdays work clinic test go home and my story is long…","Saturdays clinic equipment home."],"ans":"On Saturdays I work at the clinic. I test the equipment. I go home at two.","why":"frame + 3."},{"tag":"Fix","q":"Broken dump opener:","opts":["After work, I get home.","I am engineer with many years and after work…","Get home after work I."],"ans":"After work, I get home.","why":"frame first, then stop."},{"tag":"Fix","q":"Broken: 'I get to home and I explain all my machines.'","opts":["I get home. I eat. I rest.","I get to home. I eat. I rest.","I get home and explain all my machines in detail."],"ans":"I get home. I eat. I rest.","why":"get home + max 3."}];
let i=0,ok=0,lock=false;const app=document.getElementById("app");
function save(){try{localStorage.setItem(KEY,JSON.stringify({i,ok,t:Date.now()}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&typeof s.i==="number"){i=Math.min(s.i,ITEMS.length);ok=s.ok||0}}catch(e){}}
function render(){if(i>=ITEMS.length){app.innerHTML='<div class="card done"><h2>Listo</h2><p class="sub">'+ok+" / "+ITEMS.length+' limpios.</p><button class="btn" id="again">Otra vez</button></div>';document.getElementById("again").onclick=()=>{i=0;ok=0;save();render()};return;}
const it=ITEMS[i];app.innerHTML='<div class="card"><div class="meta">'+it.tag+" · "+(i+1)+" / "+ITEMS.length+'</div><h2>Elige la forma limpia</h2><p class="prompt">'+it.q+'</p><div class="opts" id="opts"></div><div class="fb" id="fb"></div><div class="row"><span class="score">✓ '+ok+'</span><button class="btn ghost" id="next" disabled>Siguiente</button></div></div>';
const box=document.getElementById("opts");lock=false;it.opts.forEach(o=>{const b=document.createElement("button");b.textContent=o;b.onclick=()=>{if(lock)return;lock=true;const good=o===it.ans;b.className=good?"ok":"no";[...box.children].forEach(x=>{if(x.textContent===it.ans)x.classList.add("ok")});const fb=document.getElementById("fb");fb.className="fb "+(good?"good":"bad");fb.textContent=(good?"Bien. ":"Casi. ")+it.why;if(good)ok++;document.getElementById("next").disabled=false;save();};box.appendChild(b);});
document.getElementById("next").onclick=()=>{i++;save();render()};}
load();render();
</script></body></html>
