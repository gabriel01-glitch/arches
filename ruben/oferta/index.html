  .stage{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px;line-height:1.1;margin-top:4px}

  .foot{margin-top:26px;text-align:center;font-size:12px;color:var(--credit);font-weight:700;line-height:1.6}

  @media (prefers-reduced-motion:reduce){ *,*:before,*:after{animation:none!important;transition:none!important} }
</style>

var CONTR={"doesn't":"does not","don't":"do not","didn't":"did not","couldn't":"could not","can't":"can not","cannot":"can not","isn't":"is not","it's":"it is","i'm":"i am","i'll":"i will","won't":"will not","what's":"what is","there's":"there is"};

}
function key(t){ return SAME[t]||t; }
function hasPhrase(toks,p){ var q=norm(p).map(key), k=toks.map(key); for(var i=0;i+q.length<=k.length;i++){ var ok=true; for(var j=0;j<q.length;j++) if(k[i+j]!==q[j]){ok=false;break;} if(ok) return true; } return false; }

  var tgt=norm(target), best=null;
  heardList.forEach(function(h){
    var toks=norm(h), bag={}; toks.forEach(function(t){ var k=key(t); bag[k]=(bag[k]||0)+1; });
    var hits=tgt.map(function(t){ var k=key(t); if(bag[k]){bag[k]--;return true;} if(k.length>5){ var alt=/s$/.test(k)?k.slice(0,-1):k+'s'; if(bag[alt]){bag[alt]--;return true;} } return false; });
    var content=0,contentHit=0,stop=0,stopHit=0;
    tgt.forEach(function(t,i){ if(STOP[t]){stop++; if(hits[i]) stopHit++;} else {content++; if(hits[i]) contentHit++;} });
    var bad=(forbid||[]).filter(function(f){ return hasPhrase(toks,f); });
    var pass = contentHit===content && (stop===0 || stopHit/stop>=0.6) && !bad.length;
    var score=(contentHit*2+stopHit)/(content*2+stop||1);
    var r={text:h,hits:hits,pass:pass,bad:bad,score:score};
    if(!best||(r.pass&&!best.pass)||(r.pass===best.pass&&r.score>best.score)) best=r;

var PRAISE=["Clarísimo.","Perfecto. El panel te entendió.","Eso suena a técnico con experiencia.","Muy bien dicho.","Así se contesta."];

  var h=best>0?best:Math.ceil(mid); return [w.slice(0,h).join(" "), w.slice(h).join(" ")];
}

  else if(clean) st.lvl=Math.min(3,st.lvl+1);
  else if(hard) st.lvl=Math.max(1,st.lvl-1);
  if(st.lvl>=3 && clean && before>=3) st.reps=(st.reps||0)+1; else if(st.lvl<before) st.reps=0;
  var gap = st.lvl<3 ? (st.lvl===1?0:1) : INT[Math.min(4,1+(st.reps||0))];
  st.due=addDays(t,gap);
  S.results.push({id:c.x.id,from:before,to:st.lvl});
  save();
  var up=st.lvl>before, down=st.lvl<before;
  if(up) fanfare();
  drawPanel();
  var box=document.getElementById("lineBox");
  var steps=document.querySelectorAll(".steps i"); Array.prototype.forEach.call(steps,function(s){ s.className='ok'; });
  box.innerHTML='<div class="levelup reveal"><div class="big">'+(up? (before===0?'Nivel '+st.lvl+' · '+LVL[st.lvl]:'Subes a '+LVL[st.lvl]) : down? 'Volvemos a '+LVL[st.lvl] : 'Te quedas en '+LVL[st.lvl])+'</div>'+
    '<div class="note">'+(up? (st.lvl===3?'La próxima vez, de memoria. Así la dices en la entrevista de verdad.':LVLD[st.lvl]+' la próxima vez.') : down? 'Le costó hoy. Con más ayuda se queda mejor. Es parte del método.' : 'Sale bien. Una vuelta más y subes.')+'</div>'+
    '<div class="row"><button class="btn main" id="nextQ">'+(S.i+1<S.ids.length?'Siguiente pregunta':'Terminar la sesión')+'</button></div></div>';
  document.getElementById("nextQ").onclick=function(){ S.i++; nextQuestion(); };
}
function endSession(){
  var t=today();
  if(ST.last!==t){ ST.streak = (ST.last===addDays(t,-1)) ? (ST.streak||0)+1 : 1; ST.last=t; }
  ST.sessions=(ST.sessions||0)+1; save();
  talking=-1; drawPanel();
  var ups=S.results.filter(function(r){return r.to>r.from;}).length;
  if(mastered()===Q.length && !ST.offerSeen){ ST.offerSeen=true; save(); return offerScreen(); }
  SE.innerHTML='<div class="card reveal"><div class="kicker"><span>Sesión terminada</span><span>'+mastered()+' / '+Q.length+' dominadas</span></div>'+
    '<div class="stage">'+(ups?ups+(ups===1?' pregunta subió de nivel':' preguntas subieron de nivel'):'Sesión completa')+'</div>'+
    '<div class="note">Mr. Lee toma notas. Dr. Patel sonríe un poco más. '+(mastered()<Q.length?'Cuando domines las '+Q.length+', te llega la carta de oferta.':'')+'</div>'+
    '<div class="grid">'+Q.map(function(x){ return '<i class="l'+ST.q[x.id].lvl+'"></i>'; }).join("")+'</div>'+
    '<div class="row"><button class="btn main" id="again">Otra sesión</button><a class="btn" href="../?name=Ruben">Volver</a></div></div>';
  speak("Thank you, Ruben. We'll be in touch.",0.9,PEOPLE[2].pitch);
  document.getElementById("again").onclick=startSession;
}
function offerScreen(){
  fanfare(); drawPanel();
  SE.innerHTML='<div class="card reveal"><div class="kicker"><span>Correo nuevo</span><span>Recursos Humanos</span></div>'+
    '<div class="letter"><h3>Offer Letter</h3>Dear Ruben,<br><br>Thank you for your excellent interview. We are happy to offer you the position of <b>Biomedical Equipment Technician</b>.<br><br>Welcome to the team.<br><br><i>Ms. Carter, Mr. Lee and Dr. Patel</i></div>'+
    '<div class="note">Dominaste las '+Q.length+' preguntas, de memoria. Ya no es práctica: así contestas en la entrevista de verdad. Sigue haciendo una sesión de repaso cada pocos días.</div>'+
    '<div class="row"><button class="btn main" id="home">Volver al inicio</button></div></div>';
  speak("Dear Ruben. We are happy to offer you the position. Welcome to the team.",0.88,1.1);
  document.getElementById("home").onclick=home;
}
window.__oferta={Q:Q,grade:grade,norm:norm,get S(){return S;},get ST(){return ST;},home:home};
home();
})();
</script>
