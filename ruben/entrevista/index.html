<!DOCTYPE html>
<html lang="es">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>La Entrevista · Ruben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fbf7f0; --surface:#fffdf9; --ink:#2c2722; --muted:#9a8f83;
    --line:#e9e0d3; --terra:#bf5a36; --terra-dark:#9f4528; --terra-tint:#f4e4d9;
    --good:#5a7d5a; --good-tint:#e6efe2; --bad-tint:#f6e2da; --gold:#9a6b1e; --gold-tint:#f7eede;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'Nunito',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  .wrap{max-width:540px;margin:0 auto;padding:22px 18px 64px;}

  .hello{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:40px;line-height:1.02;color:var(--ink);}
  .hello .nm{color:var(--terra);}
  .sub{font-size:14.5px;color:var(--muted);font-weight:600;margin-top:8px;line-height:1.45;}
  .streak{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:9px 16px;margin-top:16px;}
  .streak .num{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px;color:var(--terra);line-height:1;}
  .streak .lab{font-size:12.5px;color:var(--muted);font-weight:700;}

  .muscle{margin-top:16px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;}
  .muscle .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:800;}
  .muscle .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px;}
  .muscle .big{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:28px;color:var(--terra);line-height:1;}
  .muscle .hint{font-size:13px;color:var(--muted);font-weight:600;margin-top:6px;line-height:1.4;}
  .bar{height:7px;background:var(--terra-tint);border-radius:4px;margin-top:10px;overflow:hidden;}
  .bar > i{display:block;height:100%;background:var(--terra);border-radius:4px;transition:width .45s ease;}

  .bosses{display:flex;gap:10px;margin-top:12px;align-items:center;}
  .boss{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;border:2px solid var(--line);color:var(--muted);background:var(--cream);}
  .boss.won{background:var(--good-tint);border-color:var(--good);color:var(--good);}
  .bosses .lab{font-size:12.5px;color:var(--muted);font-weight:700;}

  .tracks-label{font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:800;margin:28px 4px 12px;}
  .track{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;cursor:pointer;transition:transform .08s ease,border-color .15s ease;text-align:left;width:100%;font-family:'Nunito',sans-serif;color:inherit;}
  .track:active{transform:scale(.985);border-color:var(--terra);}
  .track-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .track-title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px;color:var(--ink);line-height:1.1;}
  .track-count{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;}
  .track-note{font-size:14px;color:var(--muted);font-weight:600;margin-top:5px;line-height:1.4;}

  .ptop{display:flex;align-items:center;gap:12px;padding:6px 0 16px;}
  .pback{background:none;border:none;color:var(--terra);font-weight:800;font-size:15px;cursor:pointer;font-family:'Nunito',sans-serif;padding:6px 2px;}
  .pbar{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden;}
  .pbar > i{display:block;height:100%;background:var(--terra);transition:width .35s ease;}
  .pcount{font-size:13px;color:var(--muted);font-weight:800;white-space:nowrap;}

  .kicker{font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--terra);font-weight:800;margin-bottom:12px;}
  .card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:22px 18px;}
  .q-en{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:28px;line-height:1.18;color:var(--ink);}
  .q-es{font-size:14.5px;color:var(--muted);font-weight:600;margin-top:8px;line-height:1.4;}
  .answer{font-size:18.5px;font-weight:700;line-height:1.45;color:var(--ink);margin-top:4px;}
  .answer .line{display:block;padding:8px 0;border-bottom:1px dashed var(--line);}
  .answer .line:last-child{border-bottom:none;}
  .answer .line.on{color:var(--terra-dark);background:var(--terra-tint);margin:4px -8px;padding:10px 8px;border-radius:10px;border:none;}
  .hint{font-size:14px;color:var(--muted);font-weight:600;margin-top:10px;line-height:1.4;}
  .arch{font-size:15px;font-weight:800;color:var(--terra);letter-spacing:.4px;margin-top:8px;}
  .arch b{font-weight:800;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .chip{background:var(--terra-tint);color:var(--terra-dark);border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;}

  .btn{border:none;border-radius:14px;font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;padding:15px;cursor:pointer;transition:transform .08s ease,background .15s ease;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--terra);color:#fff;width:100%;margin-top:12px;}
  .btn-primary:active{background:var(--terra-dark);}
  .btn-good{background:var(--good);color:#fff;width:100%;margin-top:12px;}
  .row2{display:flex;gap:10px;margin-top:10px;}
  .btn-ghost{background:var(--cream);color:var(--ink);border:1.5px solid var(--line);flex:1;}
  .btn-ghost.full{width:100%;flex:none;}
  .btn-danger{background:var(--bad-tint);color:var(--terra-dark);border:1.5px solid #e8c4b6;flex:1;}

  .speaker{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--cream);border:1.5px solid var(--line);border-radius:30px;padding:12px 18px;font-weight:800;font-size:15px;color:var(--ink);cursor:pointer;font-family:'Nunito',sans-serif;margin-top:12px;width:100%;}
  .speaker:active{border-color:var(--terra);}
  .speaker.small{margin-top:8px;}

  .life{background:var(--cream);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;text-align:left;width:100%;font-family:'Nunito',sans-serif;color:inherit;}
  .life:active{border-color:var(--terra);transform:scale(.99);}
  .life .en{font-weight:800;font-size:17px;line-height:1.3;}
  .life .es{font-size:13.5px;color:var(--muted);font-weight:600;margin-top:4px;}
  .life .when{font-size:12.5px;color:var(--terra-dark);font-weight:700;margin-top:6px;}

  .opt{background:var(--cream);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16.5px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;font-family:'Nunito',sans-serif;width:100%;margin-top:10px;}
  .opt:active{transform:scale(.98);}
  .opt.ok{background:var(--good-tint);border-color:var(--good);color:var(--good);}
  .opt.no{background:var(--bad-tint);border-color:var(--terra);color:var(--terra-dark);}

  .syls{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .syl{background:var(--cream);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:800;font-size:18px;cursor:pointer;font-family:'Nunito',sans-serif;color:var(--ink);min-width:44px;min-height:44px;}
  .syl:active{transform:scale(.95);}
  .syl.ok{background:var(--good-tint);border-color:var(--good);color:var(--good);}
  .syl.no{background:var(--bad-tint);border-color:var(--terra);color:var(--terra-dark);}

  .fb{margin-top:14px;border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;line-height:1.4;}
  .fb.ok{background:var(--good-tint);color:var(--good);}
  .fb.no{background:var(--bad-tint);color:var(--terra-dark);}
  .fb.warn{background:var(--gold-tint);color:var(--gold);}
  .fb .ans{display:block;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:21px;margin-top:6px;color:var(--ink);}
  .fb .why{display:block;font-weight:600;font-size:13.5px;margin-top:6px;color:var(--muted);}

  .breathe{width:78px;height:78px;border-radius:50%;background:var(--terra-tint);margin:18px auto 8px;animation:breathe 3s ease-in-out 1;}
  .breathe-lab{text-align:center;font-weight:800;color:var(--terra);font-size:13px;letter-spacing:.08em;text-transform:uppercase;}
  @keyframes breathe{0%,100%{transform:scale(.82);opacity:.55;}50%{transform:scale(1.12);opacity:1;}}

  .stage{background:linear-gradient(160deg,#3a2a24,#5a3a32);color:#fff8f3;border-radius:20px;padding:22px 18px;margin-bottom:12px;}
  .stage .who{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .stage .avatar{width:38px;height:38px;border-radius:50%;background:#e8b48a;color:#3a2a24;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none;}
  .stage .wname{font-size:13px;font-weight:800;letter-spacing:.6px;color:#e8b48a;}
  .stage .wrole{font-size:11px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:1px;}
  .stage .q{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px;line-height:1.18;}
  .stage .qes{font-size:14px;opacity:.72;font-weight:600;margin-top:8px;}
  .stage .fu-tag{display:inline-block;background:#e8b48a;color:#3a2a24;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;border-radius:999px;padding:4px 10px;margin-bottom:10px;}

  .persona{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer;display:flex;gap:14px;align-items:center;text-align:left;width:100%;font-family:'Nunito',sans-serif;color:inherit;}
  .persona:active{transform:scale(.985);border-color:var(--terra);}
  .persona .avatar{width:52px;height:52px;border-radius:50%;background:var(--terra-tint);color:var(--terra-dark);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px;flex:none;}
  .persona.won .avatar{background:var(--good-tint);color:var(--good);}
  .persona .pn{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;line-height:1.1;}
  .persona .pr{font-size:12px;color:var(--terra-dark);font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-top:2px;}
  .persona .pd{font-size:13.5px;color:var(--muted);font-weight:600;margin-top:4px;line-height:1.35;}
  .persona .pw{font-size:12px;color:var(--good);font-weight:800;margin-top:4px;}

  .done{text-align:center;padding:24px 8px;}
  .done h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:34px;margin:0 0 6px;}
  .done .score{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:60px;color:var(--terra);line-height:1;margin:12px 0;}
  .done p{color:var(--muted);font-weight:600;font-size:15px;margin:0 0 18px;line-height:1.45;}
  .hired{background:var(--good-tint);border:2px solid var(--good);border-radius:20px;padding:20px;margin:14px 0;}
  .hired .ht{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:30px;color:var(--good);}
  .hired p{color:var(--ink);margin:8px 0 0;}

  .teacher{margin-top:22px;background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:14px 16px;}
  .teacher summary{cursor:pointer;font-weight:800;color:var(--muted);font-size:13px;list-style:none;}
  .teacher summary::-webkit-details-marker{display:none;}
  .teacher .body{font-size:13.5px;color:var(--ink);font-weight:600;line-height:1.5;margin-top:10px;}
  .teacher .body ol{margin:8px 0 0;padding-left:18px;}
  .teacher .body li{margin:6px 0;}

  .credit{text-align:center;color:#c9bdac;font-size:11.5px;font-weight:700;margin-top:28px;letter-spacing:.5px;}
  .ready{color:var(--good);font-weight:800;font-size:12.5px;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
  "use strict";

  const NAME = (new URLSearchParams(location.search).get("name") || "Ruben").trim() || "Ruben";
  const KEY = "arches-ruben-entrevista-v2";
  const OLDKEY = "arches-ruben-entrevista-v1";

  const BANK = [
    {
      id:"about",
      q:"Tell me about yourself.",
      qes:"Cuéntame de ti.",
      lines:[
        "My name is Ruben, and I am 53 years old.",
        "I am an electrical engineer from Cuba.",
        "I have many years of experience with medical equipment.",
        "Now I work at a private clinic, and I am ready for a bigger challenge."
      ],
      phon:"ai-hav ME-nii YIIRZ ov ek-SPII-ri-ans. a BI-guer CHA-lench.",
      chips:["engineer","Cuba","experience","bigger challenge"],
      why:"Tu carta de presentación, nivel dos: ahora termina con ambición.",
      fu:{ q:"Why a bigger challenge?", qes:"¿Por qué un reto más grande?",
        lines:["Because I love to learn.","A hospital has more equipment and more technology."] }
    },
    {
      id:"experience",
      q:"Tell me about your experience.",
      qes:"Cuéntame de tu experiencia.",
      lines:[
        "In Cuba, I worked as an electrical engineer for many years.",
        "I learned to repair all kinds of machines.",
        "Now, at the clinic, I check, repair, and install medical equipment.",
        "When something fails, they call me."
      ],
      phon:"in KYU-ba ai-WERKT az an en-ji-NIIR. ai-LERND tu ri-PER.",
      chips:["worked","learned","check, repair, install","they call me"],
      why:"Pasado simple: worked, learned. Dos verbos en pasado ya suenan a nivel dos.",
      fu:{ q:"What was difficult?", qes:"¿Qué fue lo difícil?",
        lines:["Old machines with no manual.","But I studied them, and I repaired them."] }
    },
    {
      id:"do",
      q:"What do you do in your current job?",
      qes:"¿Qué haces en tu trabajo actual?",
      lines:[
        "I take care of all the medical equipment.",
        "I check it, I repair it, and I install it.",
        "When a machine fails, the doctors call me first.",
        "It is a big responsibility, and I love it."
      ],
      phon:"ai-teik-KER ov OL the ME-di-kal i-KWIP-mant. res-pon-si-BI-li-tii.",
      chips:["take care","check","repair","install","responsibility"],
      why:"Antes decías tres acciones. Ahora las envuelves en una idea: responsibility.",
      fu:{ q:"Can you give me an example?", qes:"¿Me das un ejemplo?",
        lines:["Yes. When a monitor fails, I check the power and the cables first.","Then I test it, and I tell the doctor when it is ready."] }
    },
    {
      id:"whyhosp",
      q:"Why do you want to work at this hospital?",
      qes:"¿Por qué quieres trabajar en este hospital?",
      lines:[
        "A hospital has more equipment and more technology than my clinic.",
        "I want to learn and grow.",
        "I am responsible, and I take safety very seriously.",
        "My experience can help your team."
      ],
      phon:"ai-teik SEIF-tii VE-rii SII-ri-as-lii.",
      chips:["more technology","grow","safety","your team"],
      why:"No es 'necesito trabajo'. Es 'yo aporto y quiero crecer'.",
      fu:{ q:"Why should we hire you?", qes:"¿Por qué deberíamos contratarte?",
        lines:["Because I solve problems, and I don't stop until the machine works."] }
    },
    {
      id:"leaving",
      q:"Why are you leaving your clinic?",
      qes:"¿Por qué dejas tu clínica?",
      lines:[
        "I am happy at my clinic, but it is small.",
        "I want to work with more advanced equipment.",
        "This hospital is the next step for me."
      ],
      phon:"AI-am HA-pii, bat it-iz SMOL. the-NEKST STEP for-MII.",
      chips:["happy, but","advanced equipment","next step"],
      why:"Nunca hables mal de tu trabajo actual. Fórmula: feliz + pequeño + siguiente paso.",
      fu:{ q:"When can you start?", qes:"¿Cuándo puedes empezar?",
        lines:["I am flexible.","We can talk about the date."] }
    },
    {
      id:"machines",
      q:"What machines do you know?",
      qes:"¿Qué máquinas conoces?",
      lines:[
        "I work with clinic equipment every day.",
        "I know electrical systems very well.",
        "If I don't know a machine, I read the manual and I learn fast.",
        "I am always careful and safe."
      ],
      phon:"if-ai-DOUNT-nou a ma-SHIIN, ai-riid the MAN-yu-al and ai-LERN FAST.",
      chips:["every day","electrical systems","learn fast","careful"],
      why:"La respuesta estrella: honestidad + aprendo rápido. Eso contrata.",
      fu:{ q:"Do you know our brand of monitors?", qes:"¿Conoces nuestra marca de monitores?",
        lines:["Not yet.","But I can learn it fast, with the manual."] }
    },
    {
      id:"emergency",
      q:"A machine fails during an emergency. What do you do?",
      qes:"Una máquina falla durante una emergencia. ¿Qué haces?",
      lines:[
        "First, I stay calm and I go fast.",
        "I check the power and the connections.",
        "If I can't repair it quickly, I call for support.",
        "Patient safety is always first."
      ],
      phon:"FERST ai-stei-KAAM. PEI-shant SEIF-tii iz OL-weiz FERST.",
      chips:["stay calm","check the power","call for support","safety first"],
      why:"First, then, if: la estructura salva. La última línea es oro puro.",
      fu:{ q:"What if there is no support?", qes:"¿Y si no hay apoyo?",
        lines:["I tell the doctor immediately.","Communication is also safety."] }
    },
    {
      id:"strengths",
      q:"What are your strengths?",
      qes:"¿Cuáles son tus fortalezas?",
      lines:[
        "I am careful, and safety is my priority.",
        "I solve problems with calm.",
        "I don't stop until the machine works.",
        "And I am honest: if I don't know something, I say it, and I learn it."
      ],
      phon:"ai-SOLV PRO-blems with KAAM. ai-am O-nest.",
      chips:["careful","calm","don't stop","honest"],
      why:"Cuatro fortalezas con hechos, no adjetivos vacíos.",
      fu:{ q:"And what is your weakness?", qes:"¿Y tu debilidad?",
        lines:["My English is not perfect yet.","But I study every week, and I improve every month."] }
    },
    {
      id:"schedule",
      q:"What is your availability?",
      qes:"¿Cuál es tu disponibilidad?",
      lines:[
        "Now I work on weekdays from 7 to 5, and on Saturdays from 9 to 2.",
        "For this job, I am flexible.",
        "We can talk about the schedule."
      ],
      phon:"on-WEEK-deiz. on-SA-tur-deiz. ai-am FLEK-si-bal.",
      chips:["on weekdays","on Saturdays","flexible","schedule"],
      why:"Tus trampas de siempre (on, around) más la palabra mágica: flexible.",
      fu:{ q:"Can you work at night?", qes:"¿Puedes trabajar de noche?",
        lines:["If it is necessary, yes.","We can talk about it."] }
    },
    {
      id:"ask",
      q:"Do you have any questions for us?",
      qes:"¿Tienes preguntas para nosotros?",
      lines:[
        "Yes, I have two questions.",
        "What equipment does the hospital use?",
        "How big is the maintenance team?",
        "Thank you for your time."
      ],
      phon:"hau-BIG iz the MEIN-ta-nans TIIM. THANK-yu for yor-TAIM.",
      chips:["two questions","equipment","maintenance team","thank you"],
      why:"Preguntar = interés. Y cierras con gracias. Final fuerte.",
      fu:null
    }
  ];

  const LIFELINES = [
    { en:"Could you repeat that, please?", es:"¿Puede repetir, por favor?",
      phon:"ku-yu-ri-PIIT-that-PLIIZ", when:"No entendiste la pregunta." },
    { en:"Could you speak more slowly, please?", es:"¿Puede hablar más despacio, por favor?",
      phon:"ku-yu-SPIIK mor SLOU-lii PLIIZ", when:"Habla demasiado rápido." },
    { en:"That's a good question. Let me think.", es:"Buena pregunta. Déjeme pensar.",
      phon:"thats-a-GUD KWES-chan. let-mii-THINK.", when:"Te quedaste en blanco. Di esto primero. Luego tu respuesta." },
    { en:"Sorry, I don't know that word.", es:"Perdón, no conozco esa palabra.",
      phon:"SO-rii ai-DOUNT-nou that-WERD", when:"Una palabra te bloqueó." },
    { en:"Let me give you an example.", es:"Déjeme darle un ejemplo.",
      phon:"let-mii-GIV-yu an eg-ZAM-pal", when:"Tu respuesta quedó corta. Un ejemplo siempre suma. Frase de profesional." },
    { en:"I don't know that machine yet, but I can learn it fast.", es:"No conozco esa máquina todavía, pero la aprendo rápido.",
      phon:"nat-YET, bat ai-kan-LERN-it FAST", when:"Te preguntan por algo que no conoces. Honestidad + velocidad. Eso contrata." },
    { en:"I am studying English. I can do this job.", es:"Estoy estudiando inglés. Puedo hacer este trabajo.",
      phon:"ai-am STA-dii-ing ING-glish. ai-kan-DU this-JOB.", when:"Preguntan por tu inglés o te sientes juzgado." },
    { en:"Can you say that in a simpler way?", es:"¿Lo puede decir más simple?",
      phon:"kan-yu-SEI that in a SIM-pler WEI", when:"La pregunta es larga o difícil." }
  ];

  const TRAPS = [

  let voice=null, audioReady=false;
  function loadVoice(){
    const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    const NOV=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|kathy|ralph|fred|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley/i;
    const en=vs.filter(v=>/^en[-_]/i.test(v.lang)&&!NOV.test(v.name));
    const pref=["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Zira","Alex","Karen","Daniel"];
    voice=null;
    for(const p of pref){ const m=en.find(v=>v.name.indexOf(p)===0); if(m){voice=m;break;} }
    if(!voice) voice = en.find(v=>/en[-_]US/i.test(v.lang)) || en[0] || null;
  }
  if(window.speechSynthesis){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }

  function speak(text, rate){

    try{

  function markDay(){
    const s=state();
    const d=new Date(); const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(s.days.indexOf(key)<0) s.days.push(key);
    if(s.days.length>60) s.days=s.days.slice(-60);
    save(s);
  }
  function streakCount(){
    const days=state().days.slice().sort();
    if(!days.length) return 0;
    let n=0; const today=new Date(); today.setHours(0,0,0,0);
    for(let i=0;i<40;i++){
      const d=new Date(today); d.setDate(today.getDate()-i);
      const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      if(days.indexOf(key)>=0) n++; else { if(i===0) continue; break; }
    }
    return n;
  }

  function openBank(b, step){
    const total=b.fu?4:3;

    if(step===1) return bankListen(b, pct, count);
    if(step===2) return bankShadow(b, pct, count);
    if(step===3) return bankHide(b, pct, count);

  function stressGame(queue, qi, score){
    if(qi>=queue.length){
      shell("Palabras", renderVocab, 100, "fin",
        '<div class="done"><h2>'+(score>=4?"Oído de ingeniero.":"El oído se entrena. Otra ronda.")+'</h2><div class="score">'+score+'/'+queue.length+'</div><p>La sílaba fuerte es la mitad de la pronunciación. Si golpeas la correcta, te entienden aunque el resto falle.</p>'+
        '<button class="btn btn-primary" id="again">Otra ronda</button>'+
        '<div class="row2"><button class="btn btn-ghost full" id="home">Volver</button></div></div>');
      document.getElementById("again").onclick=()=>{ const q=shuffle(VOCAB).slice(0,5); stressGame(q, 0, 0); };
      document.getElementById("home").onclick=renderVocab;
      markDay();
      return;
    }
    const v=queue[qi];
    let locked=false;
    shell("Palabras", renderVocab, Math.round(qi/queue.length*100), (qi+1)+" / "+queue.length,
      '<div class="kicker">¿Dónde golpea la voz?</div><div class="card">'+
      '<div class="q-en">'+esc(v.w)+'</div>'+
      '<div class="q-es">'+esc(v.es)+'</div>'+

      '<div class="syls" id="syls"></div>'+
      '<button class="speaker" id="play">'+speakerSVG+'Oír otra vez</button>'+
      '<div id="fb"></div></div>');
    document.getElementById("play").onclick=()=>speak(v.w);
    const box=document.getElementById("syls");
    v.syls.forEach(syl=>{
      const isStrong = syl===syl.toUpperCase() && /[A-Z]/.test(syl);
      const b=el('<button class="syl">'+esc(syl.toLowerCase())+'</button>');
      b.onclick=()=>{
        if(locked) return; locked=true;
        b.className="syl "+(isStrong?"ok":"no");
        if(!isStrong){
          Array.from(box.children).forEach((c,i)=>{
            const s=v.syls[i];
            if(s===s.toUpperCase() && /[A-Z]/.test(s)) c.className="syl ok";
          });
        }
        document.getElementById("fb").innerHTML='<div class="fb '+(isStrong?'ok':'no')+'">'+(isStrong?'Eso es. ':'Casi. ')+'<span class="ans">'+archHTML(v.syls.join("-"))+'</span>'+(v.note?'<span class="why">'+esc(v.note)+'</span>':'')+'</div>';
        speak(v.w);
        const next=el('<button class="btn btn-primary">Siguiente</button>');
        next.onclick=()=>stressGame(queue, qi+1, score+(isStrong?1:0));
        document.getElementById("fb").appendChild(next);
      };
      box.appendChild(b);
    });
    setTimeout(()=>speak(v.w), 300);
  }

    LIFELINES.forEach((L,idx)=>{
      const card=el('<button class="life"><div class="en">'+esc(L.en)+'</div><div class="arch" style="margin-top:6px">'+archHTML(L.phon)+'</div><div class="es">'+esc(L.es)+'</div><div class="when">Úsala cuando: '+esc(L.when)+'</div></button>');
      card.onclick=()=>{
        speak(L.en);
        const s=state(); s.life[idx]=(s.life[idx]||0)+1; save(s);
      };
      app.appendChild(card);
    });
    const drill=el('<button class="btn btn-primary" style="margin-top:8px">Ensayar las 8 seguidas</button>');
    drill.onclick=()=>drillLifelines(0);
    app.appendChild(drill);
  }

  function drillLifelines(i){
    if(i>=LIFELINES.length){
      shell("Rescate", renderLifelines, 100, "listo",
        '<div class="done"><h2>Ocho anclas</h2><p>En la entrevista real, dos son oro: That\'s a good question, y la de la máquina que no conoces todavía.</p><button class="btn btn-primary" id="home">Volver</button></div>');
      document.getElementById("home").onclick=renderLifelines;
      return;
    }
    const L=LIFELINES[i];
    let hidden=true;
    shell("Rescate", renderLifelines, Math.round(i/LIFELINES.length*100), (i+1)+" / "+LIFELINES.length,
      '<div class="kicker">Di esto en voz alta</div><div class="card">'+
      '<div class="q-es">'+esc(L.when)+'</div>'+
      '<div class="q-en" id="shown" style="margin-top:12px">'+esc(L.en)+'</div>'+
      '<div class="arch">'+archHTML(L.phon)+'</div>'+
      '<button class="speaker" id="play">'+speakerSVG+'Escuchar y repetir</button>'+
      '<button class="btn btn-primary" id="go">Siguiente</button>'+
      '<div class="row2"><button class="btn btn-ghost full" id="hide">Ocultar / ver</button></div></div>');
    document.getElementById("play").onclick=()=>speak(L.en);
    document.getElementById("go").onclick=()=>drillLifelines(i+1);
    document.getElementById("hide").onclick=()=>{
      hidden=!hidden;
      document.getElementById("shown").textContent = hidden ? L.en : "···";
    };
    setTimeout(()=>speak(L.en), 240);
  }

  function startTraps(){
    const queue=shuffle(TRAPS.map((t,i)=>({t,i})));
    runTrap(queue, 0, 0);
  }
  function runTrap(queue, qi, score){
    if(qi>=queue.length){
      shell("Inicio", renderHome, 100, "listo",
        '<div class="done"><h2>Trampas listas</h2><div class="score">'+score+'/'+queue.length+'</div><p>Estas frases salen solas bajo presión. Por eso se practican aquí, no en la entrevista.</p>'+
        '<button class="btn btn-primary" id="again">Otra ronda</button>'+
        '<div class="row2"><button class="btn btn-ghost full" id="home">Inicio</button></div></div>');
      document.getElementById("again").onclick=startTraps;
      document.getElementById("home").onclick=renderHome;
      markDay();
      return;
    }
    const {t}=queue[qi];
    const opts=shuffle([t.right, t.wrong]);
    let locked=false;
    shell("Inicio", renderHome, Math.round(qi/queue.length*100), (qi+1)+" / "+queue.length,
      '<div class="kicker">Corrige · como en una entrevista</div><div class="card">'+
      '<div class="q-es">El entrevistador no quiere oír esto:</div>'+
      '<div class="q-en" style="font-size:24px;margin-top:8px"><s style="text-decoration-color:var(--terra);text-decoration-thickness:2px">'+esc(t.wrong)+'</s></div>'+
      '<div class="hint">¿Cuál dices?</div>'+
      '<div id="opts"></div><div id="fb"></div></div>');
    const box=document.getElementById("opts");
    opts.forEach(o=>{
      const b=el('<button class="opt">'+esc(o)+'</button>');
      b.onclick=()=>{
        if(locked) return; locked=true;
        const ok=o===t.right;
        b.className="opt "+(ok?"ok":"no");
        document.getElementById("fb").innerHTML = ok
          ? '<div class="fb ok">Eso es.<span class="ans">'+esc(t.right)+'</span><span class="why">'+esc(t.why)+'</span></div>'
          : '<div class="fb no">Cuidado. Esa es la trampa.<span class="ans">'+esc(t.right)+'</span><span class="why">'+esc(t.why)+'</span></div>';
        speak(t.right);
        const next=el('<button class="btn btn-primary">Siguiente</button>');
        next.onclick=()=>runTrap(queue, qi+1, score+(ok?1:0));
        document.getElementById("fb").appendChild(next);
      };
      box.appendChild(b);
    });
  }

  function renderPersonas(){
    const won=state().won;
    shell("Inicio", renderHome, null, null,
      '<div class="kicker">Paso 5</div><div class="q-en" style="font-size:32px;margin-bottom:8px">¿Quién te entrevista hoy?</div><div class="sub" style="margin:0 0 16px">Cada entrevistador habla distinto y pregunta distinto. Gana con los tres.</div>');
    PERSONAS.forEach(p=>{
      const w=!!won[p.id];
      const card=el('<button class="persona'+(w?' won':'')+'"><div class="avatar">'+esc(p.init)+'</div><div><div class="pn">'+esc(p.name)+'</div><div class="pr">'+esc(p.role)+'</div><div class="pd">'+esc(p.desc)+'</div>'+(w?'<div class="pw">Ya lo convenciste. Puedes repetir.</div>':'')+'</div></button>');
      card.onclick=()=>startInterview(p);
      app.appendChild(card);
    });
    const rnd=el('<button class="btn btn-primary" style="margin-top:8px">Sorpréndeme</button>');
    rnd.onclick=()=>startInterview(PERSONAS[Math.floor(Math.random()*PERSONAS.length)]);
    app.appendChild(rnd);
  }

  function startInterview(p){
    const queue=shuffle(BANK).slice(0, p.n).map(b=>({b}));
    runInterview(p, queue, 0, {good:0, mid:0, freeze:0, fuGood:0, fuTotal:0});
  }

  function runInterview(p, queue, qi, score){
    if(qi>=queue.length) return finishInterview(p, queue.length, score);
    const b=queue[qi].b;

    function stageHTML(q, qes, isFu){
      return '<div class="stage"><div class="who"><div class="avatar">'+esc(p.init)+'</div><div><div class="wname">'+esc(p.name)+'</div><div class="wrole">'+esc(p.role)+'</div></div></div>'+
        (isFu?'<div><span class="fu-tag">No se conforma · seguimiento</span></div>':'')+
        '<div class="q">'+esc(q)+'</div><div class="qes">'+esc(qes)+'</div></div>';
    }
    const pctOf=(x)=>Math.round(x/queue.length*100);

    function ask(){
      shell("Salir", renderPersonas, pctOf(qi), (qi+1)+" / "+queue.length,
        stageHTML(b.q, b.qes, false)+
        '<div class="card">'+
        '<div class="breathe" id="br"></div>'+
        '<div class="breathe-lab">Respira · luego habla</div>'+
        '<div class="hint" style="text-align:center">Tres o cuatro oraciones. Luego para.</div>'+
        '<button class="speaker" id="hearq">'+speakerSVG+'Oír la pregunta otra vez</button>'+
        '<button class="btn btn-primary" id="spoke">Ya contesté</button>'+
        '<div class="row2">'+
          '<button class="btn btn-danger" id="freeze">Me quedé en blanco</button>'+
          '<button class="btn btn-ghost" id="life">Frase de rescate</button>'+
        '</div></div>');
      document.getElementById("hearq").onclick=()=>speak(b.q, p.rate);
      document.getElementById("spoke").onclick=()=>reveal("spoke");
      document.getElementById("freeze").onclick=freezeFlow;
      document.getElementById("life").onclick=lifeFlow;
      setTimeout(()=>speak(b.q, p.rate), 260);
    }

    function lifeFlow(){
      const L=LIFELINES[2];
      shell("Salir", renderPersonas, pctOf(qi), (qi+1)+" / "+queue.length,
        '<div class="kicker">Rescate</div><div class="card">'+
        '<div class="q-en">'+esc(L.en)+'</div>'+
        '<div class="arch">'+archHTML(L.phon)+'</div>'+
        '<div class="hint">Dilo en voz alta. Ganas tres segundos. Luego tu respuesta, aunque sea una sola oración.</div>'+
        '<button class="speaker" id="play">'+speakerSVG+'Oír el rescate</button>'+
        '<button class="btn btn-primary" id="go">Ya la dije · ahora mi respuesta</button></div>');
      document.getElementById("play").onclick=()=>speak(L.en);
      document.getElementById("go").onclick=ask;
      speak(L.en);
    }

    function freezeFlow(){
      const first=b.lines[0];
      shell("Salir", renderPersonas, pctOf(qi), (qi+1)+" / "+queue.length,
        '<div class="kicker">Protocolo anti-hielo</div><div class="card">'+
        '<div class="fb warn">Está bien. Nadie espera inglés perfecto. Esperan que no te calles.</div>'+
        '<div class="q-en" style="font-size:22px;margin-top:14px">1. That\'s a good question. Let me think.</div>'+
        '<div class="q-en" style="font-size:22px;margin-top:10px">2. '+esc(first)+'</div>'+
        '<div class="hint">Di esas dos. Para. Eso ya es una respuesta.</div>'+
        '<button class="speaker" id="play">'+speakerSVG+'Oír las dos líneas</button>'+
        '<button class="btn btn-primary" id="go">Ver el modelo completo</button></div>');
      const two="That's a good question. Let me think. "+first;
      document.getElementById("play").onclick=()=>speak(two);
      document.getElementById("go").onclick=()=>reveal("freeze");
      speak(two);
    }

    function reveal(how){
      shell("Salir", renderPersonas, pctOf(qi+0.5), (qi+1)+" / "+queue.length,
        '<div class="kicker">Modelo · no tiene que ser idéntico</div><div class="card">'+
        '<div class="q-en" style="font-size:22px">'+esc(b.q)+'</div>'+
        '<div class="answer" style="margin-top:12px">'+b.lines.map(l=>'<span class="line">'+esc(l)+'</span>').join("")+'</div>'+
        '<div class="hint">¿Qué tan cerca estuviste, en voz alta?</div>'+
        '<button class="speaker" id="play">'+speakerSVG+'Oír el modelo</button>'+
        '<button class="btn btn-good" id="good">La dije bien</button>'+
        '<div class="row2"><button class="btn btn-ghost" id="mid">Más o menos</button><button class="btn btn-danger" id="no">No salió</button></div></div>');
      document.getElementById("play").onclick=()=>speakLines(b.lines, p.rate);
      const bump=(k)=>{
        score[k]++;
        if(k==="good"){ const s=state(); s.ready[b.id]=true; save(s); }
        if(k==="good" && b.fu && Math.random()<p.fuChance) followUp();
        else runInterview(p, queue, qi+1, score);
      };
      document.getElementById("good").onclick=()=>bump("good");
      document.getElementById("mid").onclick=()=>bump("mid");
      document.getElementById("no").onclick=()=>bump("freeze");
      if(how!=="freeze") speakLines(b.lines, p.rate);
    }

    function followUp(){
      const fu=b.fu;
      score.fuTotal++;
      shell("Salir", renderPersonas, pctOf(qi+0.7), (qi+1)+" / "+queue.length,
        stageHTML(fu.q, fu.qes, true)+
        '<div class="card">'+
        '<div class="hint" style="text-align:center">Sorpresa: quiere más. Contesta corto, en voz alta.</div>'+
        '<button class="speaker" id="hearq">'+speakerSVG+'Oír la pregunta otra vez</button>'+
        '<button class="btn btn-primary" id="spoke">Ya contesté · ver modelo</button></div>');
      document.getElementById("hearq").onclick=()=>speak(fu.q, p.rate);
      document.getElementById("spoke").onclick=()=>{
        shell("Salir", renderPersonas, pctOf(qi+0.85), (qi+1)+" / "+queue.length,
          '<div class="kicker">Modelo del seguimiento</div><div class="card">'+
          '<div class="answer">'+fu.lines.map(l=>'<span class="line">'+esc(l)+'</span>').join("")+'</div>'+
          '<button class="speaker" id="play">'+speakerSVG+'Oír el modelo</button>'+
          '<button class="btn btn-good" id="ok">Lo dije</button>'+
          '<div class="row2"><button class="btn btn-ghost full" id="no">No salió · sigo</button></div></div>');
        document.getElementById("play").onclick=()=>speakLines(fu.lines, p.rate);
        document.getElementById("ok").onclick=()=>{ score.fuGood++; runInterview(p, queue, qi+1, score); };
        document.getElementById("no").onclick=()=>runInterview(p, queue, qi+1, score);
        speakLines(fu.lines, p.rate);
      };
      setTimeout(()=>speak(fu.q, p.rate), 300);
    }

    ask();
  }

  function finishInterview(p, total, score){
    const s=state(); s.interviews=(s.interviews||0)+1;
    const passed = score.good >= Math.ceil(total*0.7) && score.freeze===0;
    if(passed) s.won[p.id]=true;
    save(s); markDay();
    const allWon = wonCount()===3;
    let head = passed ? p.name+" quedó convencido." : (score.good>=Math.ceil(total/2) ? "Cerca. "+p.name+" quiere otra ronda." : "Bien. El hielo se rompe así.");
    if(p.id==="sofia" && passed) head="Sofía quedó convencida.";
    if(p.id==="ingeniera" && passed) head="La Ingeniera quedó convencida.";
    let html='<div class="done"><h2>'+esc(head)+'</h2>'+
      '<div class="score">'+score.good+'/'+total+'</div>'+
      '<p>Bien dichas: '+score.good+' · Más o menos: '+score.mid+' · En blanco: '+score.freeze+
      (score.fuTotal?' · Seguimientos: '+score.fuGood+'/'+score.fuTotal:'')+'</p>';
    if(allWon) html+='<div class="hired"><div class="ht">Contratado.</div><p>Convenciste a Recursos Humanos, al Director y a la Ingeniera Jefa. Cuando llegue la entrevista real, ya la hiciste tres veces.</p></div>';
    else if(passed) html+='<p>'+(3-wonCount())+' entrevistador'+(3-wonCount()===1?'':'es')+' por convencer.</p>';
    else html+='<p>Para convencer: casi todas bien dichas y ninguna en blanco. Congelado no es fallo, es entrenamiento.</p>';
    html+='<button class="btn btn-primary" id="again">Otra entrevista</button>'+
      '<div class="row2"><button class="btn btn-ghost full" id="home">Inicio</button></div></div>';
    shell("Inicio", renderHome, 100, "fin", html);
    document.getElementById("again").onclick=renderPersonas;
    document.getElementById("home").onclick=renderHome;
  }

  renderHome();
})();
</script>
</body>
</html>
