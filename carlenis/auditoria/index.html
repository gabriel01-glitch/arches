function drawLedger(animate){
  var found=Object.keys(G?G.fixed:{}).length, done=G&&found===12;
  var el=document.getElementById("ledger");
  el.innerHTML='<div class="ledger'+(done?' done':'')+'"><div class="hd"><span>Walker Remodeling LLC · Audit FY2026</span><span>Auditor: C.</span></div>'+
   '<table><tr><td>Discrepancias conciliadas</td><td class="num">'+found+' / 12</td></tr>'+
   '<tr><td>Falsos positivos</td><td class="num">'+(G?G.fp:0)+'</td></tr>'+
   '<tr class="big"><td>Sin conciliar</td><td class="num" id="unrec">'+money(G?G.shown:START)+'</td></tr></table>'+
   '<div class="stamp'+(done?' show':'')+'" id="stamp">RECONCILED</div></div>';
  if(animate && G && G.shown!==G.unrec){
    var from=G.shown, to=G.unrec, t0=null, dur=RM?1:700, cell=document.getElementById("unrec");
    G.shown=to;
    (function step(ts){ if(!t0) t0=ts; var p=Math.min(1,(ts-t0)/dur); var v=from+(to-from)*(1-Math.pow(1-p,3)); cell.textContent=money(Math.round(v*100)/100); if(p<1) requestAnimationFrame(step); })(performance.now());
  } else if(G) G.shown=G.unrec;
}

var SE=document.getElementById("stage");
function intro(){
  G=null; drawLedger(false);
  SE.innerHTML='<div class="card reveal"><div class="kicker"><span>Tu encargo</span><span>3 documentos</span></div>'+
   '<p class="cue" style="margin-top:10px">Walker Remodeling te mandó sus papeles. Hay <b>12 errores de inglés</b> escondidos: falsos amigos, gramática, orden de palabras. Muchos son <b>tus propios errores</b> de clase.</p>'+
   '<p class="note">Toca la palabra o frase que está mal. Si tocas algo correcto, cuenta como falso positivo. Al final de cada documento, reportas al socio en voz alta.</p>'+
   (ST.plays?'<p class="note">Tu mejor auditoría: '+ST.best.found+' de 12 al primer intento, '+ST.best.fp+' falsos positivos.</p>':'')+
   '<div class="row"><button class="btn main" id="go">Abrir el primer documento</button></div></div>';
  document.getElementById("go").onclick=function(){ unlockAudio(); newGame(); drawLedger(false); renderDoc(); };
}
function tokenize(body){
  var html="", re=/\[\[([^|\]]+)\|([^\]]+)\]\]/g;
  function plain(s){ return s.split(/(\s+)/).map(function(w){ if(/^\s+$/.test(w)||!w) return w; return '<span class="t" data-ok="1">'+esc(w)+'</span>'; }).join(""); }
  function seg(s){ var out="",last=0,m; re.lastIndex=0; while((m=re.exec(s))){ out+=plain(s.slice(last,m.index)); out+='<span class="t err" data-id="'+m[2]+'" data-orig="'+esc(m[1])+'">'+esc(m[1])+'</span>'; last=re.lastIndex; } return out+plain(s.slice(last)); }
  if(body.indexOf("{{")>=0){ var parts=body.match(/\{\{(.*?)\}\}/g)||[]; parts.forEach(function(p){ var inner=p.slice(2,-2), i=inner.indexOf(": "); html+='<span class="bubble"><b>'+esc(inner.slice(0,i))+':</b> '+seg(inner.slice(i+2))+'</span>'; }); return html; }
  return seg(body);
}
function docErrIds(d){ var ids=[],re=/\[\[[^|\]]+\|([^\]]+)\]\]/g,m; while((m=re.exec(d.body))) ids.push(m[1]); return ids; }
function renderDoc(){
  var d=DOCS[G.doc], ids=docErrIds(d);
  SE.innerHTML='<div class="card reveal"><div class="kicker"><span>Documento '+(G.doc+1)+' de 3 · '+esc(d.title)+'</span><span id="left">'+ids.length+' por encontrar</span></div>'+
   '<div class="doc '+(d.kind==="chat"?"chat":"")+'"><div class="dh">'+d.head+'</div><div class="db" id="db">'+tokenize(d.body)+'</div></div>'+
   '<div class="hint" id="hint">Lee con ojo de auditora. Toca lo que no suena a inglés de oficina.</div><div id="fixBox"></div></div>';
  // restore fixed
  Array.prototype.forEach.call(SE.querySelectorAll(".t.err"),function(s){ var id=s.getAttribute("data-id"); if(G.fixed[id]){ s.classList.add("fixed"); s.textContent=ERR[id].fix; } });
  SE.querySelector("#db").addEventListener("click",function(ev){
    var t=ev.target.closest(".t"); if(!t) return;
    if(t.classList.contains("err")){ if(t.classList.contains("fixed")) return; openFix(t); return; }
    G.fp++; buzz(); t.classList.remove("nope"); void t.offsetWidth; t.classList.add("nope");
    document.getElementById("hint").innerHTML='<b>'+esc(t.textContent)+'</b> está bien. Falso positivo. Sigue buscando.';
    drawLedger(false);
  });
  updateLeft();
}
function updateLeft(){ var ids=docErrIds(DOCS[G.doc]), n=ids.filter(function(i){return !G.fixed[i];}).length; var el=document.getElementById("left"); if(el) el.textContent=n?n+" por encontrar":"Documento limpio"; return n; }
function openFix(span){
  var id=span.getAttribute("data-id"), e=ERR[id], box=document.getElementById("fixBox");
  Array.prototype.forEach.call(SE.querySelectorAll(".t.open"),function(s){s.classList.remove("open");}); span.classList.add("open");
  var tried=false;
  box.innerHTML='<div class="fix reveal"><div class="q">Discrepancia: "'+esc(span.getAttribute("data-orig"))+'". ¿Cómo queda correcto?</div><div class="opts">'+shuffle(e.opts).map(function(o){ return '<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>'; }).join("")+'</div><div id="why"></div></div>';
  box.scrollIntoView({block:"nearest",behavior:RM?"auto":"smooth"});
  Array.prototype.forEach.call(box.querySelectorAll(".opt"),function(b){
    b.onclick=function(){
      if(b.getAttribute("data-o")===e.fix){
        b.classList.add("good"); if(!tried) G.firstTry[id]=1;
        G.fixed[id]=1; G.unrec=Math.max(0,G.unrec-AMOUNTS[id]); kaching();
        span.classList.remove("open"); span.classList.add("fixed"); span.textContent=e.fix;
        document.getElementById("why").innerHTML='<div class="why reveal">'+e.why+'</div>';
        Array.prototype.forEach.call(box.querySelectorAll(".opt"),function(o){ o.disabled=true; });
        drawLedger(true);
        var n=updateLeft();
        if(n===0){ setTimeout(function(){ box.innerHTML+='<div class="row"><button class="btn main" id="rep">Reportar al socio</button></div>'; document.getElementById("rep").onclick=reportStage; if(Object.keys(G.fixed).length===12){ thump(); } },500); }
        else document.getElementById("hint").innerHTML='Conciliado. Quedan '+n+'.';
      } else { tried=true; b.classList.add("bad"); b.disabled=true; buzz(); document.getElementById("why").innerHTML='<div class="why reveal">'+e.why+'</div>'; }
    };
  });
}
function reportStage(){
  var d=DOCS[G.doc], r=d.report;
  SE.innerHTML='<div class="card reveal"><div class="kicker"><span>Reporte al socio</span><span>Documento '+(G.doc+1)+' de 3</span></div>'+
   '<div class="partner"><div class="av">B</div><div class="pq">'+esc(r.q)+'</div><button class="ibtn" id="pq" aria-label="Oír">'+ICON.speaker+'</button></div>'+
   '<div class="cue"><small>Contéstale en inglés, en voz alta</small>'+esc(r.cue)+'</div>'+
   '<div class="target hid" id="tgt">'+esc(r.en)+'</div>'+
   '<div class="say-row"><button class="mic" id="mic" aria-label="Micrófono">'+ICON.mic+'</button><div class="say-help" id="help"><b>Toca el micrófono</b> y contesta. Sin ver la frase: tú ya sabes cómo.</div></div>'+
   '<div class="heard" id="heard"></div><div id="verdict"></div>'+
   '<div class="row"><button class="btn" id="peek">Ver la frase</button><button class="btn" id="model">Oír el modelo</button><button class="btn main" id="next" style="display:none">Siguiente</button></div></div>';
  setTimeout(function(){ speak(r.q,0.92,0.9); },300);
  document.getElementById("pq").onclick=function(){ speak(r.q,0.92,0.9); };
  var tgt=document.getElementById("tgt"), tries=0, nextBtn=document.getElementById("next");
  document.getElementById("peek").onclick=function(){ tgt.classList.remove("hid"); };
  document.getElementById("model").onclick=function(){ tgt.classList.remove("hid"); speak(r.en,0.88,1); };
  nextBtn.onclick=advance;
  function done(ok){ if(ok) G.spoken++; kaching(); document.getElementById("mic").disabled=true; nextBtn.style.display=""; nextBtn.focus(); }
  if(!canListen()){ document.getElementById("help").innerHTML='<b>Dilo en voz alta</b> y toca el micrófono cuando termines. (Para que te revise, ábrelo en Safari o Chrome.)'; document.getElementById("mic").onclick=function(){ tgt.classList.remove("hid"); document.getElementById("verdict").innerHTML='<div class="verdict ok">Anotado.</div>'; done(true); }; return; }
  document.getElementById("mic").onclick=function(){
    var mic=this; if(recBusy){ try{rec.stop();}catch(e){} return; }
    mic.classList.add("on"); document.getElementById("heard").innerHTML="Escuchando...";
    var ok=listen(function(t){ document.getElementById("heard").innerHTML='Te oigo: <i>'+esc(t.trim())+'</i>'; },function(list){
      mic.classList.remove("on");
      if(!list.length){ document.getElementById("heard").innerHTML= micBlocked?"El micrófono no está disponible. Toca Siguiente cuando lo digas.":"No te oí. Intenta otra vez."; if(micBlocked){ nextBtn.style.display=""; } return; }
      tries++; var g=grade(r.en,r.forbid,list);
      document.getElementById("heard").innerHTML='Te oí: <i>'+esc(g.text)+'</i>';
      tgt.classList.remove("hid");
      var words=r.en.split(/\s+/),hi=0; tgt.innerHTML=words.map(function(w){ var n=norm(w).length, s=g.hits.slice(hi,hi+n); hi+=n; return '<span class="w '+(s.length&&s.every(Boolean)?'hit':'miss')+'">'+esc(w)+'</span>'; }).join(" ");
      if(g.pass){ document.getElementById("verdict").innerHTML='<div class="verdict ok reveal">"Excellent. That is exactly what I needed."</div>'; speak("Excellent. That is exactly what I needed.",0.92,0.9); done(true); }
      else { buzz(); document.getElementById("verdict").innerHTML='<div class="verdict no reveal">'+(g.bad.length?'Se coló: <b>'+esc(g.bad[0])+'</b>. Otra vez.':'Casi. Las palabras subrayadas no se oyeron. Otra vez.')+'</div>'; if(tries>=3){ nextBtn.style.display=""; nextBtn.textContent="Seguir"; } }
    });
    if(!ok){ mic.classList.remove("on"); }
  };
}
function advance(){ G.doc++; if(G.doc<DOCS.length){ renderDoc(); window.scrollTo({top:0,behavior:RM?"auto":"smooth"}); } else opinion(); }
function opinion(){
  var ft=Object.keys(G.firstTry).length, clean=G.fp<=2;
  ST.plays=(ST.plays||0)+1; if(!ST.best||ft>ST.best.found||(ft===ST.best.found&&G.fp<ST.best.fp)) ST.best={found:ft,fp:G.fp}; save();
  drawLedger(false);
  var missed=Object.keys(ERR).filter(function(k){return !G.firstTry[k];});
  SE.innerHTML='<div class="card reveal"><div class="kicker"><span>Opinión de auditoría</span><span>'+(ST.plays)+(ST.plays===1?' auditoría':' auditorías')+'</span></div>'+
   '<div class="opinion"><div class="seal'+(clean?'':' q')+'">'+(clean?'Unqualified opinion':'Qualified opinion')+'<small>'+(clean?'Estados limpios. Firma la socia.':'Limpios, con salvedades: '+G.fp+' falsos positivos.')+'</small></div></div>'+
   '<div class="h2">'+ft+' de 12 al primer intento</div>'+
   '<p class="note" style="text-align:center">Reportes en voz alta: '+G.spoken+' de 3. '+(clean?'Una auditora que no inventa errores vale oro.':'La próxima: menos toques al azar, más ojo.')+'</p>'+
   '<div class="rules">'+
    '<div class="rule"><h3>Falsos amigos de oficina</h3><p>resumen = <b>summary</b> · solicitud = <b>request</b> · armar = <b>assemble</b> · actualmente = <b>currently</b> · asistir = <b>attend</b> · ordenada = <b>organized</b></p></div>'+
    '<div class="rule"><h3>Gramática que delata</h3><p><b>much information</b> (sin -s) · necessary <b>for me</b> · I <b>agree</b> · was <b>built</b> · he <b>said</b> that / told <b>us</b> that</p></div>'+
    '<div class="rule"><h3>Preguntas</h3><p>How could <b>AI do</b> it? · How could <b>the software do</b> it?</p></div>'+
   '</div>'+
   (missed.length?'<div class="why" style="margin-top:14px"><b>Repasa:</b> '+missed.map(function(k){return esc(ERR[k].fix);}).join(" · ")+'</div>':'')+
   '<div class="row"><button class="btn main" id="again">Otra auditoría</button><a class="btn" href="../?name=Carlenis">Volver</a></div></div>';
  speak(clean?"Unqualified opinion. Clean books, Carlenis.":"Qualified opinion. Good work, with a few exceptions.",0.9,0.9);
  document.getElementById("again").onclick=intro;
}
window.__aud={DOCS:DOCS,ERR:ERR,grade:grade,get G(){return G;}};
intro();
})();
</script>
