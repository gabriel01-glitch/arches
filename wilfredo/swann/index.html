<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bajo la casa · Wilfredo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --soil:#241910;
    --paper:#f4efe4;
    --ink:#241c16;
    --muted:#4e453c;
    --line:#e0d3c2;
    --copper:#8a3e22;
    --copper-deep:#5c2614;
    --cream:#fff8f2;
    --brass:#8a6a2e;
    --moss:#1c5c38;
    --moss-s:#e3f1e8;
    --leak:#7a2e22;
    --leak-s:#f8e4dc;
    --sky:#1b2430;
    --ease:cubic-bezier(0.23, 1, 0.32, 1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0;}
  body{
    background:var(--soil);
    color:var(--ink);
    font-family:"Source Sans 3",system-ui,sans-serif;
    font-size:17px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:#f0d7c4;color:var(--ink);}
  :focus-visible{outline:3px solid var(--copper);outline-offset:3px;}
  button,a{font-family:inherit;}
  .sheet{
    max-width:440px;
    margin:0 auto;
    background:var(--paper);
    min-height:100vh;
    padding:14px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;}
  .back{
    color:var(--copper);
    font-weight:700;
    font-size:15px;
    text-decoration:none;
    min-height:44px;
    display:inline-flex;
    align-items:center;
  }
  .count{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin:0;}
  h1{
    font-family:Fraunces,Georgia,serif;
    font-weight:700;
    font-size:clamp(34px,9vw,46px);
    line-height:.98;
    letter-spacing:-.03em;
    margin:8px 0 10px;
    color:var(--ink);
  }
  .sheet.drill h1{font-size:28px;margin:2px 0 0;}
  .deck{margin:0 0 14px;font-size:17.5px;line-height:1.45;}
  .rules{margin:0 0 14px;padding:0;list-style:none;}
  .rules li{
    margin:0 0 8px;
    padding:8px 0 8px 12px;
    border-left:3px solid var(--copper);
    font-weight:600;
  }
  .say{
    margin:0 0 16px;
    padding:12px 12px 10px;
    background:#fff;
    border-radius:12px;
    border:1.5px solid var(--line);
  }
  .say .lab{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--copper);margin-bottom:4px;
  }
  .say p{margin:0;font-family:Fraunces,Georgia,serif;font-size:22px;line-height:1.2;font-weight:600;}
  .ghost{
    border:0;background:transparent;color:var(--copper);
    font-weight:700;font-size:14px;min-height:44px;padding:8px 2px;cursor:pointer;
  }
  .btn{
    display:flex;align-items:center;justify-content:center;
    width:100%;min-height:52px;padding:12px 16px;
    border:0;border-radius:12px;
    background:var(--copper-deep);color:var(--cream);
    font-weight:700;font-size:17px;cursor:pointer;
  }
  .btn:disabled{background:#e0d3c2;color:var(--muted);cursor:default;}
  .btn.quiet{
    background:transparent;color:var(--copper-deep);
    border:1.5px solid var(--line);margin-top:8px;
  }
  .stage{
    margin:8px 0 12px;
    border-radius:16px;
    overflow:hidden;
    background:var(--sky);
    line-height:0;
  }
  .scene{width:100%;height:auto;display:block;}
  .sky{fill:var(--sky);}
  .moon{fill:#f3e6c4;}
  .roof{fill:#2a231c;}
  .wall{fill:#3c332b;}
  .window{fill:#24303a;}
  .phone{fill:#24303a;}
  .crawl{fill:#140f0c;}
  .joists line{stroke:#3d332b;stroke-width:3;}
  .dirt{fill:#2a2118;}
  .pipe{fill:#8d97a3;}
  .valve circle{fill:#c6a15a;}
  .valve path{stroke:#5c4516;stroke-width:1.6;fill:none;}
  .drops circle{fill:#8fd0de;opacity:0;}
  .heater-old rect{fill:#6a4634;}
  .heater-old .band{fill:#c6a15a;}
  .heater-new{opacity:0;}
  .heater-new rect{fill:#8a5a3a;}
  .heater-new .band{fill:#f0d7a4;}
  .pan{fill:#7a4a2a;}
  .breaker rect{fill:#3a332c;}
  .breaker .switch{fill:#2a2622;}
  .panel rect{fill:#4a4036;stroke:#c6a15a;stroke-width:1.2;}
  .panel line{stroke:#c6a15a;stroke-width:1;}
  .panel{transform:translateX(14px);}
  .heater-old,.heater-new,.panel{transition:transform .4s var(--ease),opacity .4s var(--ease);}

  .look-call .window,.look-call-done .window{fill:#7eb8c9;}
  .look-call .phone,.look-call-done .phone{fill:#f3e6c4;}
  .look-call .drops circle,.look-call-done .drops circle,.look-valve .drops circle{opacity:1;}
  .look-call .drops circle,.look-call-done .drops circle,.look-valve .drops circle{animation:drip 1.5s ease-in infinite;}
  .drops circle:nth-child(2){animation-delay:.35s;}
  .drops circle:nth-child(3){animation-delay:.7s;}
  @keyframes drip{
    0%{transform:translateY(0);opacity:0;}
    25%{opacity:1;}
    100%{transform:translateY(12px);opacity:0;}
  }
  .look-dry .valve circle,.look-power .valve circle,.look-power-off .valve circle,
  .look-pan .valve circle,.look-pan-gone .valve circle,.look-lift .valve circle,
  .look-lift-gone .valve circle,.look-seat .valve circle,.look-seat-done .valve circle,
  .look-panel .valve circle,.look-shut .valve circle,.look-done .valve circle{fill:#e7c27a;}
  .look-power .breaker .switch{fill:#e0b15a;}
  .look-power-off .breaker .switch,.look-pan .breaker .switch,.look-pan-gone .breaker .switch,
  .look-lift .breaker .switch,.look-lift-gone .breaker .switch,.look-seat .breaker .switch,
  .look-seat-done .breaker .switch,.look-panel .breaker .switch,.look-shut .breaker .switch,
  .look-done .breaker .switch{fill:#1a1816;}
  .look-pan-gone .pan,.look-lift .pan,.look-lift-gone .pan,.look-seat .pan,
  .look-seat-done .pan,.look-panel .pan,.look-shut .pan,.look-done .pan{opacity:0;}
  .look-lift .heater-old{transform:translate(16px,-18px);}
  .look-lift-gone .heater-old,.look-seat .heater-old,.look-seat-done .heater-old,
  .look-panel .heater-old,.look-shut .heater-old,.look-done .heater-old{opacity:0;}
  .look-seat .heater-new{opacity:1;transform:translateY(14px);}
  .look-seat-done .heater-new,.look-panel .heater-new,.look-shut .heater-new,.look-done .heater-new{opacity:1;transform:none;}
  .look-shut .panel,.look-done .panel{transform:none;}
  .look-shut .window,.look-done .window{fill:#e7c27a;}

  .es{margin:0 0 8px;color:var(--muted);font-weight:600;font-size:15.5px;}
  .built{
    font-family:Fraunces,Georgia,serif;
    font-weight:600;
    font-size:28px;
    line-height:1.2;
    margin:0 0 12px;
    letter-spacing:-.02em;
  }
  .slot{
    display:inline-block;
    min-width:1.6em;
    padding:0 4px 1px;
    border-bottom:2px solid var(--copper);
    color:var(--muted);
    font-weight:700;
  }
  .slot.on{color:var(--ink);}
  .lab{
    margin:12px 0 6px;
    font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--copper);
  }
  .stamps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .stamp{
    min-height:52px;padding:10px 8px;
    background:#fff;color:var(--ink);
    border:1.5px solid var(--line);border-radius:12px;
    font-weight:700;font-size:15.5px;line-height:1.2;cursor:pointer;
    transition:transform .16s var(--ease),background .16s ease,border-color .16s ease,color .16s ease;
  }
  .stamp.on{background:var(--copper-deep);color:var(--cream);border-color:var(--copper-deep);}
  .stamp.bad{background:var(--leak-s);color:var(--leak);border-color:var(--leak);}
  .stamp.good{background:var(--moss-s);color:var(--moss);border-color:var(--moss);}
  .stamps.shake{animation:nope .18s ease-in-out;}
  @keyframes nope{
    0%,100%{transform:none;}
    30%{transform:translateX(-5px);}
    70%{transform:translateX(5px);}
  }
  .coach{
    min-height:22px;margin:10px 0 0;
    font-weight:700;font-size:15.5px;color:var(--leak);
  }
  .coach.ok{color:var(--moss);}
  .locked{
    font-family:Fraunces,Georgia,serif;
    font-size:26px;font-weight:600;line-height:1.2;
    margin:12px 0 8px;color:var(--ink);
  }
  .dock{
    position:sticky;bottom:0;
    padding-top:12px;
    background:linear-gradient(180deg,rgba(244,239,228,0),var(--paper) 30%);
  }
  .actions{margin-top:14px;}
  .actions .btn + .btn{margin-top:8px;}
  .story-line{
    margin:0 0 8px;padding:8px 0 8px 12px;
    border-left:3px solid var(--copper);
    font-family:Fraunces,Georgia,serif;
    font-size:22px;font-weight:600;line-height:1.25;
  }
  .clock{
    font-family:Fraunces,Georgia,serif;
    font-size:64px;line-height:1;font-weight:700;
    margin:6px 0 4px;letter-spacing:-.03em;
  }
  .choice{
    display:block;width:100%;text-align:left;
    min-height:52px;margin:0 0 8px;padding:12px 14px;
    background:#fff;border:1.5px solid var(--line);border-radius:12px;
    font-weight:700;font-size:16.5px;line-height:1.3;color:var(--ink);cursor:pointer;
  }
  .choice.bad{background:var(--leak-s);border-color:var(--leak);color:var(--leak);}
  .choice.good{background:var(--moss-s);border-color:var(--moss);color:var(--moss);}
  .broken{
    font-family:Fraunces,Georgia,serif;
    font-size:26px;font-weight:600;line-height:1.2;
    margin:4px 0 12px;color:var(--leak);
    text-decoration:line-through;text-decoration-thickness:2px;
  }
  .killer{
    font-family:Fraunces,Georgia,serif;
    font-size:30px;font-weight:700;line-height:1.15;
    letter-spacing:-.02em;margin:8px 0 8px;
  }
  .static{padding-top:22px;}
  .static li{margin:0 0 8px;}
  @media (hover:hover) and (pointer:fine){
    .stamp:hover,.choice:hover,.btn:hover{transform:translateY(-2px);}
    .btn:disabled:hover{transform:none;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important;}
    .look-call .drops circle,.look-call-done .drops circle,.look-valve .drops circle{opacity:.9;transform:none;}
  }
</style>
</head>
<body>
<noscript>
  <article class="sheet static">
    <h1>Bajo la casa</h1>
    <p>Domingo por la noche, una casa en South Tampa. Ya cambiaste el calentador. Ahora cuéntalo en inglés: el trabajo terminó, así que cada verbo va en pasado, y cada phrasal verb lleva su partícula (off, out, in, back).</p>
    <ol>
      <li>I got the call at nine.</li>
      <li>I shut off the main valve.</li>
      <li>I turned off the breaker.</li>
      <li>I dug out the rusted pan.</li>
      <li>I took out the old heater.</li>
      <li>I put in the new heater.</li>
      <li>I put back the panel and went home.</li>
    </ol>
    <p>I shut off the main, turned off the breaker, dug out the pan, took out the old heater, and put in a new one.</p>
    <h2>Cuatro frases con error y su versión correcta</h2>
    <ul>
      <li>Yesterday I take out the valve. → Yesterday I took out the valve.</li>
      <li>I putted in a new faucet. → I put in a new faucet.</li>
      <li>I shut the water. / Close the water. → I shut off the water.</li>
      <li>Then I check and I go home. → Then I checked and I went home.</li>
    </ul>
  </article>
</noscript>
<div id="app"></div>
<script>
(function(){
  "use strict";

  var BEATS = [
    {
      look:"call", lookDone:"call-done",
      see:"Teléfono en la ventana. Agua todavía bajo la casa.",
      es:"Paso 1. Te llamaron a las nueve. Completa la frase con el verbo en pasado.",
      before:"I", mid:"the call at nine.",
      verb:{
        choices:[
          {v:"get", why:"El trabajo ya terminó: el verbo va en pasado. Get → got."},
          {v:"goed", why:"Goed no existe. El pasado de get es got."},
          {v:"got", why:""}
        ],
        answer:"got"
      },
      line:"I got the call at nine."
    },
    {
      look:"valve", lookDone:"dry",
      see:"El agua corre. La válvula todavía abierta.",
      es:"Paso 2. Primero cierras el agua en la válvula principal. Verbo en pasado + partícula.",
      before:"I", mid:"the main valve.",
      verb:{
        choices:[
          {v:"shutted", why:"Shut es irregular y no cambia: hoy shut, ayer shut. Shutted no existe."},
          {v:"shut", why:""},
          {v:"shutting", why:"-ing es para algo que pasa ahora mismo. Esto ya pasó: shut."}
        ],
        answer:"shut"
      },
      particle:{
        choices:[
          {v:"", show:"sin partícula", why:"Falta la partícula. Shut off = cerrar el paso del agua. Sin off, la frase queda incompleta."},
          {v:"out", why:"Out es sacar algo. Para cerrar el agua o apagar algo se usa off: shut off."},
          {v:"off", why:""}
        ],
        answer:"off"
      },
      line:"I shut off the main valve."
    },
    {
      look:"power", lookDone:"power-off",
      see:"El breaker sigue encendido, ámbar.",
      es:"Paso 3. Apagas la corriente en el breaker antes de meterte bajo la casa.",
      before:"I", mid:"the breaker.",
      verb:{
        choices:[
          {v:"turned", why:""},
          {v:"turn", why:"Fue ayer, así que va en pasado: turned."},
          {v:"turned offed", why:"La partícula nunca lleva -ed. El pasado ya está en turned: turned off."}
        ],
        answer:"turned"
      },
      particle:{
        choices:[
          {v:"out", why:"Out es sacar algo. Apagar la corriente es off: turned off."},
          {v:"off", why:""},
          {v:"", show:"sin partícula", why:"Sin off, turned solo significa que giraste algo. Apagar es turned off."}
        ],
        answer:"off"
      },
      line:"I turned off the breaker."
    },
    {
      look:"pan", lookDone:"pan-gone",
      see:"La bandeja oxidada, abajo del calentador.",
      es:"Paso 4. Sacas la bandeja oxidada que está debajo del calentador.",
      before:"I", mid:"the rusted pan.",
      verb:{
        choices:[
          {v:"dig", why:"El trabajo ya terminó: dig → dug."},
          {v:"digged", why:"Digged no existe. El pasado de dig es dug."},
          {v:"dug", why:""}
        ],
        answer:"dug"
      },
      particle:{
        choices:[
          {v:"off", why:"Off es apagar. Sacar algo hacia afuera es out: dug out."},
          {v:"out", why:""},
          {v:"", show:"sin partícula", why:"Falta out. Dug out = sacar cavando. Sin out, no queda claro que la sacaste."}
        ],
        answer:"out"
      },
      line:"I dug out the rusted pan."
    },
    {
      look:"lift", lookDone:"lift-gone",
      see:"El calentador viejo, a medio salir.",
      es:"Paso 5. Sacas el calentador viejo.",
      before:"I", mid:"the old heater.",
      verb:{
        choices:[
          {v:"taked", why:"Taked no existe. El pasado de take es took."},
          {v:"took", why:""},
          {v:"take", why:"Estás contando algo que ya pasó: took, no take."}
        ],
        answer:"took"
      },
      particle:{
        choices:[
          {v:"", show:"sin partícula", why:"Falta out. Took out = sacar. Sin out, took solo significa que tomaste algo."},
          {v:"off", why:"Off es apagar. Sacar es out: took out."},
          {v:"out", why:""}
        ],
        answer:"out"
      },
      line:"I took out the old heater."
    },
    {
      look:"seat", lookDone:"seat-done",
      see:"El calentador nuevo, todavía en el aire.",
      es:"Paso 6. Instalas el calentador nuevo.",
      before:"I", mid:"the new heater.",
      verb:{
        choices:[
          {v:"putting", why:"-ing es para ahora mismo. Esto ya pasó: I put."},
          {v:"putted", why:"Put es irregular y no cambia: hoy put, ayer put. Putted no existe."},
          {v:"put", why:""}
        ],
        answer:"put"
      },
      particle:{
        choices:[
          {v:"back", why:"Back es volver a poner algo en su lugar. Instalar algo nuevo es in: put in."},
          {v:"", show:"sin partícula", why:"Falta in. Put in = instalar. Sin in, put solo significa que pusiste algo."},
          {v:"in", why:""}
        ],
        answer:"in"
      },
      line:"I put in the new heater."
    },
    {
      look:"panel", lookDone:"shut",
      see:"El panel abierto. La casa todavía despierta.",
      es:"Paso 7. Vuelves a poner el panel y te vas a tu casa. Dos verbos, los dos en pasado.",
      before:"I", mid:"the panel and", tailAfter:"home.",
      verb:{
        choices:[
          {v:"putted", why:"Put es irregular y no cambia: hoy put, ayer put. Putted no existe."},
          {v:"put", why:""},
          {v:"putting", why:"-ing es para ahora mismo. Esto ya pasó: I put."}
        ],
        answer:"put"
      },
      particle:{
        choices:[
          {v:"back", why:""},
          {v:"in", why:"In es instalar algo nuevo. El panel vuelve a su lugar: put back."},
          {v:"", show:"sin partícula", why:"Falta back. Put back = volver a poner en su lugar: put back the panel."}
        ],
        answer:"back"
      },
      tail:{
        choices:[
          {v:"go", why:"Los dos verbos van en pasado: put back... and went home. Go → went."},
          {v:"goed", why:"go → went. Goed no existe."},
          {v:"went", why:""}
        ],
        answer:"went"
      },
      line:"I put back the panel and went home."
    }
  ];

  var TRAPS = [
    {
      es:"El error más común: contar el trabajo de ayer en presente. Elige la frase correcta.",
      broken:"Yesterday I take out the valve.",
      choices:[
        {t:"Yesterday I took out the valve.", ok:true},
        {t:"Yesterday I taked out the valve.", why:"Taked no existe. El pasado de take es took."},
        {t:"Yesterday I take outed the valve.", why:"La partícula out nunca lleva -ed. Y el verbo es took."}
      ]
    },
    {
      es:"Instalaste un grifo nuevo. Elige la frase correcta.",
      broken:"I putted in a new faucet.",
      choices:[
        {t:"I put in a new faucet.", ok:true},
        {t:"I putted a new faucet.", why:"Putted no existe, y además falta la partícula in."},
        {t:"I put ined a new faucet.", why:"La partícula in nunca lleva -ed: I put in."}
      ]
    },
    {
      es:"Cerrar el agua se dice shut off. Elige la frase correcta.",
      broken:"I shut the water.",
      choices:[
        {t:"I shut off the water.", ok:true},
        {t:"I close the water.", why:"Para el agua no se usa close. Se dice shut off."},
        {t:"I shut offed the water.", why:"La partícula off nunca lleva -ed: shut off."}
      ]
    },
    {
      es:"Dos verbos seguidos: los dos van en pasado. Elige la frase correcta.",
      broken:"Then I check and I go home.",
      choices:[
        {t:"Then I checked and I went home.", ok:true},
        {t:"Then I checked and I go home.", why:"Checked está bien, pero go también tiene que ir en pasado: went."},
        {t:"Then I check and I went home.", why:"Went está bien, pero check también tiene que ir en pasado: checked."}
      ]
    }
  ];

  var KILLER = "I shut off the main, turned off the breaker, dug out the pan, took out the old heater, and put in a new one.";
  var OLD = "I shut off the water, took out the old valve, and put in a new one.";

  var phase = "open";
  var bi = 0;
  var ti = 0;
  var pick = {};
  var sealed = false;
  var clockId = null;
  var clockLeft = 60;

  function esc(s){
    var amp = String.fromCharCode(38);
    return String(s == null ? "" : s)
      .replace(/&/g, amp + "amp;")
      .replace(/</g, amp + "lt;")
      .replace(/>/g, amp + "gt;")
      .replace(/"/g, amp + "quot;");
  }
  function clearTimer(){
    if(clockId){ clearInterval(clockId); clockId = null; }
  }
  function speak(text){
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.92;
    var voices = window.speechSynthesis.getVoices();
    var NOV = /albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|kathy|ralph|fred|eloquence|grandma|grandpa|reed|rocko|sandy|shelley|flo/i;
    var en = voices.filter(function(v){ return /^en[-_]/i.test(v.lang) && !NOV.test(v.name); });
    var pref = ["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Zira","Alex"];
    var voice = null;
    for(var p=0;p<pref.length;p++){ var m = en.filter(function(v){ return v.name.indexOf(pref[p])===0; })[0]; if(m){ voice = m; break; } }
    if(!voice) voice = en.filter(function(v){ return /en[-_]US/i.test(v.lang); })[0] || en[0] || null;
    if(voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  }
  if(window.speechSynthesis){
    window.speechSynthesis.onvoiceschanged = function(){};
  }

  function scene(look, label){
    return '<div class="stage look-'+esc(look)+'">'+
      '<svg class="scene" viewBox="0 0 360 168" role="img" aria-label="'+esc(label)+'">'+
        '<rect class="sky" width="360" height="168"></rect>'+
        '<circle class="moon" cx="314" cy="22" r="9"></circle>'+
        '<polygon class="roof" points="34,72 170,24 326,72"></polygon>'+
        '<rect class="wall" x="76" y="72" width="208" height="30"></rect>'+
        '<rect class="window" x="96" y="80" width="28" height="14" rx="1"></rect>'+
        '<rect class="phone" x="166" y="78" width="10" height="16" rx="2"></rect>'+
        '<rect class="crawl" x="26" y="104" width="308" height="56" rx="4"></rect>'+
        '<g class="joists"><line x1="48" y1="104" x2="48" y2="160"></line><line x1="108" y1="104" x2="108" y2="160"></line><line x1="252" y1="104" x2="252" y2="160"></line><line x1="312" y1="104" x2="312" y2="160"></line></g>'+
        '<rect class="dirt" x="26" y="150" width="308" height="12"></rect>'+
        '<rect class="pipe" x="86" y="126" width="108" height="7" rx="3"></rect>'+
        '<g class="valve"><circle cx="124" cy="118" r="10"></circle><path d="M124 109 v18 M115 118 h18"></path></g>'+
        '<g class="drops"><circle cx="154" cy="138" r="2.5"></circle><circle cx="166" cy="142" r="2.1"></circle><circle cx="146" cy="146" r="1.8"></circle></g>'+
        '<g class="heater-old"><rect x="178" y="114" width="42" height="36" rx="7"></rect><rect class="band" x="186" y="122" width="26" height="4" rx="1"></rect></g>'+
        '<g class="heater-new"><rect x="178" y="114" width="42" height="36" rx="7"></rect><rect class="band" x="186" y="122" width="26" height="4" rx="1"></rect></g>'+
        '<ellipse class="pan" cx="199" cy="150" rx="26" ry="5"></ellipse>'+
        '<g class="breaker"><rect x="60" y="110" width="24" height="30" rx="2"></rect><rect class="switch" x="66" y="116" width="12" height="7" rx="1"></rect></g>'+
        '<g class="panel"><rect x="230" y="108" width="54" height="42" rx="2"></rect><line x1="257" y1="108" x2="257" y2="150"></line></g>'+
      '</svg></div>';
  }

  function head(count){
    return '<div class="top"><a class="back" href="../?name=Wilfredo">‹ Temas</a>'+
      (count ? '<p class="count">'+esc(count)+'</p>' : '')+'</div>'+
      '<h1>Bajo la casa</h1>';
  }

  function slot(kind, text, on){
    return '<span class="slot'+(on?' on':'')+'" id="slot-'+kind+'">'+esc(text)+'</span>';
  }

  function stampRow(kind, group){
    var html = '<p class="lab">'+(kind==="verb"?"Verbo":kind==="particle"?"Partícula":"Y después...")+'</p><div class="stamps" data-row="'+kind+'">';
    group.choices.forEach(function(c){
      var label = c.show || c.v;
      var slotText = c.v === "" ? "( )" : c.v;
      var pressed = pick[kind] === c.v ? "true" : "false";
      var on = pick[kind] === c.v ? " on" : "";
      html += '<button type="button" class="stamp'+on+'" data-kind="'+kind+'" data-val="'+esc(c.v)+'" data-slot="'+esc(slotText)+'" aria-pressed="'+pressed+'">'+esc(label)+'</button>';
    });
    return html + '</div>';
  }

  function render(){
    clearTimer();
    var root = document.getElementById("app");
    if(phase==="open") renderOpen(root);
    else if(phase==="beat") renderBeat(root);
    else if(phase==="story") renderStory(root);
    else if(phase==="trap") renderTrap(root);
    else renderDone(root);
  }

  function renderOpen(root){
    root.innerHTML =
      '<article class="sheet">'+
        head("")+
        '<p class="deck">Domingo por la noche, una casa en South Tampa. Ya cambiaste el calentador. Ahora cuéntalo en inglés, paso por paso.</p>'+
        '<ul class="rules">'+
          '<li><b>Regla 1.</b> El trabajo ya terminó, así que cada verbo va en pasado: turn → turned, go → went, check → checked.</li>'+
          '<li><b>Regla 2.</b> Los phrasal verbs llevan una partícula que no se puede omitir: shut <b>off</b>, took <b>out</b>, put <b>in</b>, put <b>back</b>. La partícula nunca lleva -ed.</li>'+
        '</ul>'+
        '<div class="say"><div class="lab">Dilo conmigo <button type="button" class="ghost" id="hear">Oír</button></div>'+
          '<p>The job is done, so every verb is in the past. And the small word stays: off, out, in, back.</p></div>'+
        '<button type="button" class="btn" id="go">Empezar: bajo la casa</button>'+
      '</article>';
    document.getElementById("hear").onclick = function(){
      speak("The job is done, so every verb is in the past. And the small word stays: off, out, in, back.");
    };
    document.getElementById("go").onclick = function(){
      bi = 0; pick = {}; sealed = false; phase = "beat"; render();
    };
  }

  function face(val, chosen){
    if(!chosen) return "___";
    if(val === "") return "( )";
    return val;
  }
  function sentence(b){
    var vOn = pick.verb != null;
    var pOn = !!(b.particle && pick.particle != null);
    var tOn = !!(b.tail && pick.tail != null);
    var html = "I "+slot("verb", face(pick.verb, vOn), vOn)+" ";
    if(b.particle) html += slot("particle", face(pick.particle, pOn), pOn)+" ";
    html += esc(b.mid);
    if(b.tail) html += " "+slot("tail", face(pick.tail, tOn), tOn)+" "+esc(b.tailAfter);
    return html;
  }
  function ready(b){
    if(pick.verb == null) return false;
    if(b.particle && pick.particle == null) return false;
    if(b.tail && pick.tail == null) return false;
    return true;
  }

  function renderBeat(root){
    var b = BEATS[bi];
    root.innerHTML =
      '<article class="sheet drill">'+
        head("Paso "+(bi+1)+" de "+BEATS.length)+
        scene(sealed ? b.lookDone : b.look, b.see)+
        '<p class="es">'+esc(b.es)+'</p>'+
        '<p class="built" id="built">'+sentence(b)+'</p>'+
        '<div id="rows">'+
          stampRow("verb", b.verb)+
          (b.particle ? stampRow("particle", b.particle) : "")+
          (b.tail ? stampRow("tail", b.tail) : "")+
        '</div>'+
        '<p class="coach" id="coach" aria-live="polite"></p>'+
        '<p class="locked" id="locked" hidden></p>'+
        '<div class="dock">'+
          '<button type="button" class="btn" id="seal"'+(ready(b)?"":" disabled")+'">Confirmar este paso</button>'+
          '<button type="button" class="btn quiet" id="hear" hidden>Oír la frase</button>'+
          '<button type="button" class="btn" id="next" hidden>'+(bi===BEATS.length-1?"Contar el trabajo en voz alta":"Siguiente paso")+'</button>'+
        '</div>'+
      '</article>';
    var rows = document.getElementById("rows");
    rows.onclick = function(e){
      var btn = e.target.closest(".stamp");
      if(!btn || sealed) return;
      var kind = btn.getAttribute("data-kind");
      pick[kind] = btn.getAttribute("data-val");
      rows.querySelectorAll('[data-kind="'+kind+'"]').forEach(function(el){
        var on = el === btn;
        el.classList.toggle("on", on);
        el.classList.remove("bad");
        el.setAttribute("aria-pressed", on ? "true" : "false");
      });
      var hole = document.getElementById("slot-"+kind);
      hole.textContent = btn.getAttribute("data-slot") || "( )";
      hole.classList.add("on");
      var coach = document.getElementById("coach");
      coach.textContent = "";
      coach.className = "coach";
      document.getElementById("seal").disabled = !ready(b);
    };
    document.getElementById("seal").onclick = function(){ trySeal(root, b); };
    document.getElementById("next").onclick = function(){
      if(bi < BEATS.length-1){ bi++; pick = {}; sealed = false; phase = "beat"; }
      else { phase = "story"; }
      render();
    };
    var hear = document.getElementById("hear");
    hear.onclick = function(){ speak(b.line); };
    if(sealed) showSealed(b);
  }

  function showSealed(b){
    sealed = true;
    document.getElementById("rows").hidden = true;
    var coach = document.getElementById("coach");
    coach.textContent = "Correcto.";
    coach.className = "coach ok";
    var locked = document.getElementById("locked");
    locked.hidden = false;
    locked.textContent = b.line;
    document.getElementById("built").hidden = true;
    document.getElementById("seal").hidden = true;
    document.getElementById("hear").hidden = false;
    document.getElementById("next").hidden = false;
  }

  function whyFor(group, val){
    for(var i=0;i<group.choices.length;i++){
      if(group.choices[i].v === val) return group.choices[i].why || "Casi. Prueba otra opción.";
    }
    return "Casi. Prueba otra opción.";
  }

  function trySeal(root, b){
    if(sealed) return;
    var vOk = pick.verb === b.verb.answer;
    var pOk = !b.particle || pick.particle === b.particle.answer;
    var tOk = !b.tail || pick.tail === b.tail.answer;
    if(vOk && pOk && tOk){
      document.querySelector(".stage").className = "stage look-"+b.lookDone;
      showSealed(b);
      return;
    }
    var msg = !vOk ? whyFor(b.verb, pick.verb) : (!pOk ? whyFor(b.particle, pick.particle) : whyFor(b.tail, pick.tail));
    var coach = document.getElementById("coach");
    coach.textContent = msg;
    coach.className = "coach";
    var rowName = !vOk ? "verb" : (!pOk ? "particle" : "tail");
    var row = document.querySelector('[data-row="'+rowName+'"]');
    if(row){
      row.classList.remove("shake");
      void row.offsetWidth;
      row.classList.add("shake");
      row.querySelectorAll(".stamp").forEach(function(btn){
        btn.classList.remove("bad");
        if(btn.getAttribute("data-val") === pick[rowName] && btn.getAttribute("data-val") !== (rowName==="verb"?b.verb:rowName==="particle"?b.particle:b.tail).answer){
          btn.classList.add("bad");
        }
      });
    }
  }

  function renderStory(root){
    clockLeft = 60;
    var lines = BEATS.map(function(b){ return '<p class="story-line">'+esc(b.line)+'</p>'; }).join("");
    root.innerHTML =
      '<article class="sheet drill">'+
        head("60 segundos")+
        scene("done", "La casa en calma. El trabajo está hecho.")+
        '<p class="es">Cuenta el trabajo completo en un minuto, en voz alta. Si se te escapa un verbo en presente (I turn, I go, I check), para y repítelo en pasado.</p>'+
        '<p class="clock" id="clock">1:00</p>'+
        '<p class="story-line">Sunday night in South Tampa.</p>'+
        lines+
        '<div class="actions">'+
          '<button type="button" class="btn" id="tick">Empezar el minuto</button>'+
          '<button type="button" class="btn quiet" id="model">Oír el modelo</button>'+
          '<button type="button" class="btn quiet" id="said">Ya lo conté</button>'+
        '</div>'+
      '</article>';
    document.getElementById("tick").onclick = function(){
      var btn = this;
      var el = document.getElementById("clock");
      if(clockId){ clearTimer(); btn.textContent = "Seguir el minuto"; return; }
      if(clockLeft <= 0) clockLeft = 60;
      if(el) el.textContent = Math.floor(clockLeft/60)+":"+((clockLeft%60)<10?"0":"")+(clockLeft%60);
      btn.textContent = "Pausa";
      clockId = setInterval(function(){
        clockLeft--;
        var el = document.getElementById("clock");
        if(!el){ clearTimer(); return; }
        if(clockLeft <= 0){
          clearTimer();
          el.textContent = "0:00";
          btn.textContent = "Otra toma";
          clockLeft = 60;
          return;
        }
        var s = clockLeft % 60;
        el.textContent = Math.floor(clockLeft/60)+":"+(s<10?"0":"")+s;
      }, 1000);
    };
    document.getElementById("model").onclick = function(){
      speak("Sunday night in South Tampa. "+BEATS.map(function(b){return b.line;}).join(" "));
    };
    document.getElementById("said").onclick = function(){
      ti = 0; phase = "trap"; render();
    };
  }

  function renderTrap(root){
    var trap = TRAPS[ti];
    var buttons = trap.choices.map(function(c, i){
      return '<button type="button" class="choice" data-i="'+i+'">'+esc(c.t)+'</button>';
    }).join("");
    root.innerHTML =
      '<article class="sheet drill">'+
        head("Frase con error "+(ti+1)+" de "+TRAPS.length)+
        '<p class="es">'+esc(trap.es)+'</p>'+
        '<p class="broken">'+esc(trap.broken)+'</p>'+
        '<div id="choices">'+buttons+'</div>'+
        '<p class="coach" id="coach" aria-live="polite"></p>'+
        '<div class="dock"><button type="button" class="btn" id="next" hidden>'+(ti===TRAPS.length-1?"La frase final":"Siguiente error")+'</button></div>'+
      '</article>';
    document.getElementById("choices").onclick = function(e){
      var btn = e.target.closest(".choice");
      if(!btn || btn.disabled) return;
      var c = trap.choices[Number(btn.getAttribute("data-i"))];
      var coach = document.getElementById("coach");
      if(!c.ok){
        btn.classList.add("bad");
        coach.textContent = c.why;
        coach.className = "coach";
        return;
      }
      document.querySelectorAll(".choice").forEach(function(el){ el.disabled = true; });
      btn.classList.add("good");
      coach.textContent = "Correcto.";
      coach.className = "coach ok";
      document.getElementById("next").hidden = false;
      speak(c.t);
    };
    document.getElementById("next").onclick = function(){
      if(ti < TRAPS.length-1){ ti++; phase = "trap"; }
      else phase = "done";
      render();
    };
  }

  function renderDone(root){
    root.innerHTML =
      '<article class="sheet">'+
        head("")+
        '<p class="deck">Léela dos veces en voz alta: despacio, y luego rápido, como en la obra.</p>'+
        '<p class="lab">La frase de esta noche (el calentador)</p>'+
        '<p class="killer">'+esc(KILLER)+'</p>'+
        '<button type="button" class="btn" id="h1">Oír la frase de esta noche</button>'+
        '<p class="lab">La frase de la semana pasada (la válvula)</p>'+
        '<p class="killer">'+esc(OLD)+'</p>'+
        '<button type="button" class="btn quiet" id="h2">Oír la frase de la semana pasada</button>'+
        '<button type="button" class="btn quiet" id="again">Otra vez desde el principio</button>'+
      '</article>';
    document.getElementById("h1").onclick = function(){ speak(KILLER); };
    document.getElementById("h2").onclick = function(){ speak(OLD); };
    document.getElementById("again").onclick = function(){
      phase = "open"; bi = 0; ti = 0; pick = {}; sealed = false; render();
    };
  }

  render();
})();
</script>
</body>
</html>
